name: Format Stage 1 Replay Fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'ops/apply-stage1-replay-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: fix/stage1-replay-fail-closed
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Format regression test
        run: uv run ruff format tests/regression/test_dataset_replay_idempotency.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-stage1-replay-test-${{ github.run_id }}
          path: tests/regression/test_dataset_replay_idempotency.py
          if-no-files-found: error
          retention-days: 1
