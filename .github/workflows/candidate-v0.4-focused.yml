name: Candidate v0.4 Focused Verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: candidate-v0-4-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  task-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: >-
          uv run ruff format --check --diff
          src/gemini_trading/strategy/policy.py
          src/gemini_trading/strategy/v0_4_policy.py
          src/gemini_trading/cli/strategy.py
          tests/unit/strategy/test_policy_v0_3.py
          tests/unit/strategy/test_policy_v0_4.py
          tests/unit/cli/test_strategy_v0_3.py
          tests/unit/cli/test_strategy_v0_4.py
      - run: >-
          uv run ruff check
          src/gemini_trading/strategy/policy.py
          src/gemini_trading/strategy/v0_4_policy.py
          src/gemini_trading/cli/strategy.py
          tests/unit/strategy/test_policy_v0_3.py
          tests/unit/strategy/test_policy_v0_4.py
          tests/unit/cli/test_strategy_v0_3.py
          tests/unit/cli/test_strategy_v0_4.py
      - run: >-
          uv run pyright
          src/gemini_trading/strategy/policy.py
          src/gemini_trading/strategy/v0_4_policy.py
          src/gemini_trading/cli/strategy.py
          tests/unit/strategy/test_policy_v0_3.py
          tests/unit/strategy/test_policy_v0_4.py
          tests/unit/cli/test_strategy_v0_3.py
          tests/unit/cli/test_strategy_v0_4.py
      - run: >-
          uv run pytest
          tests/unit/strategy/test_policy_v0_3.py
          tests/unit/strategy/test_policy_v0_4.py
          tests/unit/cli/test_strategy_v0_3.py
          tests/unit/cli/test_strategy_v0_4.py
          -v
