name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  task11-12:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task11_apply.py
      - run: uv run python scripts/temporary_task12_apply.py
      - run: >-
          uv run ruff format
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/acceptance/test_sealed_historical_validation_documentation.py
      - run: >-
          uv run ruff check
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/acceptance/test_sealed_historical_validation_documentation.py
      - run: >-
          uv run pyright
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
      - run: >-
          uv run pytest
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/acceptance/test_sealed_historical_validation_documentation.py
          -q

  task11-12-finalize:
    needs: task11-12
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task11_apply.py
      - run: uv run python scripts/temporary_task12_apply.py
      - run: >-
          uv run ruff format
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/acceptance/test_sealed_historical_validation_documentation.py
      - name: Commit verified Tasks 11 and 12 and restore normal CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch scripts/temporary_task11_*.py scripts/temporary_task12_*.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/sealed-btcusdt-dataset.yml \
            .github/workflows/sealed-btcusdt-study.yml \
            README.md \
            docs/operations/sealed-btcusdt-historical-validation.md \
            reports/verification/sealed-btcusdt-historical-validation-progress.md \
            src/gemini_trading/strategy/sealed_dataset_identity.py \
            tests/acceptance/test_sealed_historical_validation_documentation.py \
            tests/acceptance/test_sealed_historical_validation_workflows.py \
            tests/unit/strategy/test_sealed_dataset_identity.py
          git commit -m "feat: enforce sealed dataset v4 workflow identity"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
