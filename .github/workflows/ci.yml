name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Format Task 1-2 files exactly
        run: >-
          uv run ruff format
          src/gemini_trading/data/exchange_closures.py
          src/gemini_trading/data/segments.py
          src/gemini_trading/data/validation/candles.py
          tests/fixtures/market_data/gapped_btcusdt_4h.py
          tests/unit/data/test_candle_segments.py
          tests/unit/data/test_exchange_closures.py
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Capture focused Task 1-2 pytest diagnostics
        id: focused_pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest \
            tests/unit/data/test_exchange_closures.py \
            tests/unit/data/test_candle_segments.py \
            -vv 2>&1 | tee /tmp/task1-2-pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task1-2-pytest-${{ github.sha }}
          path: /tmp/task1-2-pytest.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce focused pytest result
        if: steps.focused_pytest.outcome == 'failure'
        run: exit 1

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
