name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Format Task 1-2 files exactly
        run: >-
          uv run ruff format
          src/gemini_trading/data/exchange_closures.py
          src/gemini_trading/data/segments.py
          src/gemini_trading/data/validation/candles.py
          tests/fixtures/market_data/gapped_btcusdt_4h.py
          tests/unit/data/test_candle_segments.py
          tests/unit/data/test_exchange_closures.py
      - uses: actions/upload-artifact@v4
        with:
          name: task1-2-ruff-formatted-${{ github.sha }}
          path: |
            src/gemini_trading/data/exchange_closures.py
            src/gemini_trading/data/segments.py
            src/gemini_trading/data/validation/candles.py
            tests/fixtures/market_data/gapped_btcusdt_4h.py
            tests/unit/data/test_candle_segments.py
            tests/unit/data/test_exchange_closures.py
          if-no-files-found: error
          retention-days: 1
      - run: uv run ruff check .
      - name: Capture Pyright diagnostics
        id: pyright
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pyright 2>&1 | tee /tmp/pyright.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task1-2-pyright-${{ github.sha }}
          path: /tmp/pyright.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce Pyright result
        if: steps.pyright.outcome == 'failure'
        run: exit 1
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
