name: Push Inline Completion

on:
  pull_request:

permissions:
  contents: write

jobs:
  push:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and push verified implementation
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          cat .github/inline-patch/part* | base64 --decode | gzip --decompress > /tmp/inline-completion.patch
          git apply --check /tmp/inline-completion.patch
          git apply /tmp/inline-completion.patch
          git restore --source=HEAD -- \
            .github/workflows/sealed-btcusdt-dataset.yml \
            .github/workflows/sealed-btcusdt-study.yml
          rm -rf .github/inline-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: complete verified exchange-closure gap manifest"
          git push origin "HEAD:${HEAD_REF}"
