name: Diagnose Inline Completion

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Validate staged patch
        run: |
          set +e
          {
            wc -c .github/inline-patch/part*
            cat .github/inline-patch/part* > /tmp/inline-completion.patch.gz.b64
            wc -c /tmp/inline-completion.patch.gz.b64
            base64 --decode /tmp/inline-completion.patch.gz.b64 > /tmp/inline-completion.patch.gz
            echo "base64_status=$?"
            gzip --test /tmp/inline-completion.patch.gz
            echo "gzip_status=$?"
            gzip --decompress --stdout /tmp/inline-completion.patch.gz > /tmp/inline-completion.patch
            echo "decompress_status=$?"
            wc -c /tmp/inline-completion.patch
            git apply --check /tmp/inline-completion.patch
            echo "apply_status=$?"
          } > /tmp/inline-patch-diagnostic.txt 2>&1
          cat /tmp/inline-patch-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-patch-diagnostic-${{ github.sha }}
          path: |
            /tmp/inline-patch-diagnostic.txt
            /tmp/inline-completion.patch
          if-no-files-found: error
          retention-days: 1
