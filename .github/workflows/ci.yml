name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Format corrected Task 1 files exactly
        run: >-
          uv run ruff format
          src/gemini_trading/data/exchange_closures.py
          tests/unit/data/test_exchange_closures.py
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-task1-ruff-${{ github.sha }}
          path: |
            src/gemini_trading/data/exchange_closures.py
            tests/unit/data/test_exchange_closures.py
          if-no-files-found: error
          retention-days: 1
      - run: uv run ruff check .
      - run: uv run pyright

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
