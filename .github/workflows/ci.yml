name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  task10:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Capture optimized Task 10 verification
        run: |
          set +e
          uv run python scripts/temporary_task10_cache_preparation.py > task10-optimized-script.txt 2>&1
          cache_status=$?
          verifier_status=99
          ruff_status=99
          pyright_status=99
          pytest_status=99
          if [ "$cache_status" -eq 0 ]; then
            uv run python scripts/temporary_task10_lightweight_verifier.py >> task10-optimized-script.txt 2>&1
            verifier_status=$?
          fi
          if [ "$cache_status" -eq 0 ] && [ "$verifier_status" -eq 0 ]; then
            uv run ruff check tests/integration/test_sealed_historical_validation.py --fix >> task10-optimized-script.txt 2>&1
            uv run ruff format tests/integration/test_sealed_historical_validation.py >> task10-optimized-script.txt 2>&1
            uv run ruff check src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/candidate_strategy_e2e_worker.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py tests/integration/test_sealed_historical_validation.py > task10-optimized-ruff.txt 2>&1
            ruff_status=$?
            uv run pyright src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/candidate_strategy_e2e_worker.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py tests/integration/test_sealed_historical_validation.py > task10-optimized-pyright.txt 2>&1
            pyright_status=$?
            timeout 900s uv run pytest tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py tests/integration/test_sealed_historical_validation.py -q > task10-optimized-pytest.txt 2>&1
            pytest_status=$?
          else
            git checkout HEAD -- tests/integration/test_sealed_historical_validation.py
            printf '%s\n' 'verification skipped because a fixture patch failed' > task10-optimized-ruff.txt
            printf '%s\n' 'verification skipped because a fixture patch failed' > task10-optimized-pyright.txt
            printf '%s\n' 'verification skipped because a fixture patch failed' > task10-optimized-pytest.txt
          fi
          printf 'cache_status=%s\nverifier_status=%s\nruff_status=%s\npyright_status=%s\npytest_status=%s\n' \
            "$cache_status" "$verifier_status" "$ruff_status" "$pyright_status" "$pytest_status" \
            > task10-optimized-status.txt
          exit 0
      - name: Persist optimized result and restore normal CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch \
            task10-cache-script.txt \
            task10-cache-ruff.txt \
            task10-cache-pyright.txt \
            task10-cache-pytest.txt \
            task10-cache-status.txt \
            task10-memo-script.txt \
            task10-memo-ruff.txt \
            task10-memo-pyright.txt \
            task10-memo-pytest.txt \
            task10-memo-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/temporary_task10_cache_preparation.py \
            scripts/temporary_task10_lightweight_verifier.py \
            tests/integration/test_sealed_historical_validation.py \
            .github/workflows/ci.yml \
            task10-optimized-script.txt \
            task10-optimized-ruff.txt \
            task10-optimized-pyright.txt \
            task10-optimized-pytest.txt \
            task10-optimized-status.txt
          git commit -m "test: persist optimized Task 10 verification"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
