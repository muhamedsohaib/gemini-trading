name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  task10-static:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_expand_calibration.py
      - run: uv run python scripts/temporary_task11_apply.py
      - run: >-
          uv run ruff format
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/integration/test_sealed_historical_validation.py
      - run: >-
          uv run ruff check
          src/gemini_trading/strategy/pre_final.py
          src/gemini_trading/strategy/replay.py
          src/gemini_trading/strategy/sealed_evaluator.py
          src/gemini_trading/strategy/sealed_verification.py
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/candidate_strategy_e2e_worker.py
          tests/unit/strategy/test_pre_final.py
          tests/unit/strategy/test_sealed_manifest_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/integration/test_sealed_historical_validation.py
      - run: >-
          uv run pyright
          src/gemini_trading/strategy/pre_final.py
          src/gemini_trading/strategy/replay.py
          src/gemini_trading/strategy/sealed_evaluator.py
          src/gemini_trading/strategy/sealed_verification.py
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/candidate_strategy_e2e_worker.py
          tests/unit/strategy/test_pre_final.py
          tests/unit/strategy/test_sealed_manifest_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/integration/test_sealed_historical_validation.py
      - run: >-
          uv run pytest
          tests/unit/strategy/test_pre_final.py
          tests/unit/strategy/test_sealed_manifest_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          -q

  task10-prepare:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_expand_calibration.py
      - run: uv run ruff format tests/integration/test_sealed_historical_validation.py
      - run: >-
          uv run pytest
          tests/integration/test_sealed_historical_validation.py::test_prepare_does_not_materialize_final_phase
          -q

  task10-complete:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_expand_calibration.py
      - run: uv run ruff format tests/integration/test_sealed_historical_validation.py
      - name: Run complete sealed chain
        run: |
          set -o pipefail
          uv run pytest tests/integration/test_sealed_historical_validation.py::test_complete_requires_matching_durable_receipt -vv -s 2>&1 | tee task10-complete-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task10-complete-output-${{ github.sha }}-${{ github.run_id }}
          path: task10-complete-output.txt
          if-no-files-found: error
          retention-days: 7

  task10-finalize:
    needs: [task10-static, task10-prepare, task10-complete]
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_expand_calibration.py
      - run: uv run python scripts/temporary_task11_apply.py
      - run: >-
          uv run ruff format
          src/gemini_trading/strategy/sealed_dataset_identity.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          tests/acceptance/test_sealed_historical_validation_workflows.py
          tests/integration/test_sealed_historical_validation.py
      - name: Commit verified Tasks 10 and 11 and restore normal CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch scripts/temporary_task10_*.py scripts/temporary_task11_*.py task10-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/sealed-btcusdt-dataset.yml \
            .github/workflows/sealed-btcusdt-study.yml \
            src/gemini_trading/strategy/sealed_dataset_identity.py \
            tests/acceptance/test_sealed_historical_validation_workflows.py \
            tests/integration/test_sealed_historical_validation.py \
            tests/unit/strategy/test_sealed_dataset_identity.py
          git commit -m "feat: enforce sealed dataset v4 identity end to end"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
