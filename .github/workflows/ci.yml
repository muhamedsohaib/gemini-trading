name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  task10:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_bound_decisions.py
      - run: uv run ruff format tests/integration/test_sealed_historical_validation.py
      - name: Capture bounded Task 10 verification
        run: |
          set +e
          uv run ruff check src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/candidate_strategy_e2e_worker.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py tests/integration/test_sealed_historical_validation.py > task10-decision-ruff.txt 2>&1
          ruff_status=$?
          uv run pyright src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/candidate_strategy_e2e_worker.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py tests/integration/test_sealed_historical_validation.py > task10-decision-pyright.txt 2>&1
          pyright_status=$?
          uv run pytest tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py tests/integration/test_sealed_historical_validation.py -q > task10-decision-pytest.txt 2>&1
          pytest_status=$?
          printf 'ruff_status=%s\npyright_status=%s\npytest_status=%s\n' \
            "$ruff_status" "$pyright_status" "$pytest_status" \
            > task10-decision-status.txt
          exit 0
      - name: Persist result and restore normal CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f --ignore-unmatch \
            scripts/temporary_task10_fixture_name.py \
            scripts/temporary_task10_bound_decisions.py \
            task10-pyright-diagnostic.txt \
            task10-pyright-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/integration/test_sealed_historical_validation.py \
            .github/workflows/ci.yml \
            task10-decision-ruff.txt \
            task10-decision-pyright.txt \
            task10-decision-pytest.txt \
            task10-decision-status.txt
          git commit -m "test: persist bounded Task 10 verification"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
