name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  task10:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'research/verified-multi-closure-partial-candle-manifest' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_finalize.py
      - run: uv run ruff check src/gemini_trading/strategy/replay.py --fix
      - run: uv run ruff format src/gemini_trading/strategy/replay.py tests/unit/strategy/test_pre_final.py
      - name: Capture final focused diagnostics
        run: |
          set +e
          uv run ruff check src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py > task10-final-ruff.txt 2>&1
          echo "ruff_status=$?" > task10-final-status.txt
          uv run pyright src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py > task10-final-pyright.txt 2>&1
          echo "pyright_status=$?" >> task10-final-status.txt
          uv run pytest tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py -q > task10-final-pytest.txt 2>&1
          echo "pytest_status=$?" >> task10-final-status.txt
          uv run pytest tests/integration -q > task10-final-integration.txt 2>&1
          echo "integration_status=$?" >> task10-final-status.txt
          exit 0
      - name: Commit final Task 10 diagnostic and restore CI
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f scripts/temporary_task10_finalize.py task10-ruff.txt task10-pyright.txt task10-pytest.txt task10-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/strategy/replay.py tests/unit/strategy/test_pre_final.py .github/workflows/ci.yml task10-final-ruff.txt task10-final-pyright.txt task10-final-pytest.txt task10-final-integration.txt task10-final-status.txt
          git commit -m "test: persist final Task 10 diagnostics"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
