name: Diagnose Stage 1 PR

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture failed Stage 1 diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 30220725616 \
            --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,headSha,status,conclusion,createdAt,url,jobs \
            > /tmp/stage1-run.json
          gh run view 30220725616 \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed \
            > /tmp/stage1-failed.log
          cat /tmp/stage1-run.json
          tail -n 200 /tmp/stage1-failed.log
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-failure-diagnostic-${{ github.sha }}
          path: |
            /tmp/stage1-run.json
            /tmp/stage1-failed.log
          if-no-files-found: error
          retention-days: 1
