name: Dispatch Stage 1 PR

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify intended merged-main source
        run: test "${{ github.event.pull_request.base.sha }}" = "cf8389f6b8964b5aee0563083f8bf362be33b1ab"
      - name: Dispatch merged-main Stage 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sealed-btcusdt-dataset.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Dispatched Sealed BTCUSDT Dataset from main."
