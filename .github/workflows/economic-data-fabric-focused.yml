name: Economic Data Fabric Focused Verification

on:
  pull_request:
    paths:
      - "src/gemini_trading/economics/**"
      - "tests/unit/economics/**"
      - "tests/integration/economics/**"
      - "docs/architecture/economic-forecasting-source-of-truth.md"
      - "docs/superpowers/specs/2026-09-15-economic-data-fabric-v1-design.md"
      - "docs/superpowers/plans/2026-09-15-economic-data-fabric-v1.md"
      - ".github/workflows/economic-data-fabric-focused.yml"

permissions:
  contents: read

concurrency:
  group: economic-data-fabric-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run pytest tests/unit/economics/data/test_observation.py -v
