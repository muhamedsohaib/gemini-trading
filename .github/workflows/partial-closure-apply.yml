name: Partial Closure Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - name: Export exact branch source
        shell: bash
        run: |
          tar -czf /tmp/partial-closure-exact-source.tgz \
            --exclude='./.git' \
            --exclude='./.venv' \
            --exclude='./dist' \
            --exclude='./build' \
            .
          git rev-parse HEAD > /tmp/partial-closure-exact-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-exact-source-${{ github.sha }}
          path: |
            /tmp/partial-closure-exact-source.tgz
            /tmp/partial-closure-exact-head.txt
          if-no-files-found: error
          retention-days: 1
