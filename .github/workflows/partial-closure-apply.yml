name: Partial Closure Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Capture post-source gate diagnostics
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/partial-closure-final-diagnostic.txt) 2>&1
          echo "HEAD=$(git rev-parse HEAD)"
          cat .tmp/partial-closure-patch-{00..06}.b64 > /tmp/partial-closure-patch.b64
          echo "BASE64_SHA=$(sha256sum /tmp/partial-closure-patch.b64 | cut -d' ' -f1)"
          base64 -d /tmp/partial-closure-patch.b64 | xz -d > /tmp/partial-closure.patch
          echo "DECODE_STATUS=$?"
          echo "PATCH_SHA=$(sha256sum /tmp/partial-closure.patch | cut -d' ' -f1)"
          git apply --reject --whitespace=nowarn /tmp/partial-closure.patch
          echo "APPLY_STATUS=$?"
          echo "REJECT_COUNT=$(find . -name '*.rej' -type f | wc -l)"
          find . -name '*.rej' -type f -print -exec sha256sum {} \;
          rm -f tests/unit/data/test_exchange_closures.py.rej
          git rm \
            .tmp/partial-closure-patch-*.b64 \
            .tmp/partial-closure-exact-*.b64 \
            .github/workflows/partial-closure-apply.yml
          echo "GIT_RM_STATUS=$?"
          uv run ruff format --check .
          echo "RUFF_FORMAT_STATUS=$?"
          uv run ruff check .
          echo "RUFF_CHECK_STATUS=$?"
          uv run pyright
          echo "PYRIGHT_STATUS=$?"
          uv run pytest -q \
            tests/unit/data/test_exchange_closures.py \
            tests/unit/data/test_candle_exclusions.py \
            tests/unit/data/test_candle_segments.py \
            tests/unit/data/datasets/test_canonical_writer.py \
            tests/unit/data/ingestion/test_service.py \
            tests/unit/data/storage/test_local_immutable.py \
            tests/integration/test_market_data_exchange_closure_v2.py \
            tests/integration/test_research_dataset_reader.py \
            tests/unit/strategy/test_handoff.py \
            tests/unit/strategy/test_pre_final.py \
            tests/unit/strategy/test_sealed_manifest_identity.py \
            tests/acceptance/test_sealed_historical_validation_documentation.py
          echo "PYTEST_STATUS=$?"
          uv run python -m build
          echo "BUILD_STATUS=$?"
          git add -A
          git diff --cached --check
          echo "DIFF_CHECK_STATUS=$?"
          git status --short
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-final-diagnostic-${{ github.sha }}
          path: /tmp/partial-closure-final-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
