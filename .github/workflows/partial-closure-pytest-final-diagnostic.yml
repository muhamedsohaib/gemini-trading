name: Partial Closure Final Pytest Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Capture full pytest failure summary
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short > /tmp/partial-closure-final-pytest.txt 2>&1
          status=$?
          cat /tmp/partial-closure-final-pytest.txt
          echo "$status" > /tmp/partial-closure-final-pytest-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-final-pytest-${{ github.sha }}
          path: |
            /tmp/partial-closure-final-pytest.txt
            /tmp/partial-closure-final-pytest-status.txt
          if-no-files-found: error
          retention-days: 1
