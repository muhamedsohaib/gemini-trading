name: Partial Closure Secret Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Capture allowlist gate diagnostics
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/partial-closure-allowlist-diagnostic.txt) 2>&1
          python - <<'PY'
          from pathlib import Path

          digest = "6d0ed02c75960a3acf11073a2b7276e0bdc04f217fc99a488b15a5ff68e70775"
          paths = (
              Path("src/gemini_trading/cli/historical_validation.py"),
              Path("src/gemini_trading/strategy/handoff.py"),
              Path("tests/sealed_dataset_support.py"),
              Path("tests/acceptance/test_sealed_historical_validation_workflows.py"),
              Path("tests/acceptance/test_sealed_historical_validation_documentation.py"),
              Path("tests/integration/test_sealed_historical_validation.py"),
              Path("tests/unit/data/test_candle_exclusions.py"),
              Path("tests/unit/data/test_exchange_closures.py"),
          )
          for path in paths:
              lines = path.read_text().splitlines()
              matches = 0
              output: list[str] = []
              for line in lines:
                  if digest in line:
                      matches += 1
                      if "pragma: allowlist secret" not in line:
                          line += "  # pragma: allowlist secret"
                  output.append(line)
              print(f"{path}: matches={matches}")
              if matches < 1:
                  raise SystemExit(f"approved digest not found in {path}")
              path.write_text("\n".join(output) + "\n")
          PY
          echo "ANNOTATE_STATUS=$?"
          uv run ruff format .
          echo "RUFF_WRITE_STATUS=$?"
          uv run ruff format --check .
          echo "RUFF_FORMAT_STATUS=$?"
          uv run ruff check .
          echo "RUFF_CHECK_STATUS=$?"
          uv run pyright
          echo "PYRIGHT_STATUS=$?"
          uv run pre-commit run detect-secrets --all-files --verbose
          echo "SECRET_STATUS=$?"
          git diff --check
          echo "DIFF_CHECK_STATUS=$?"
          git status --short
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-allowlist-diagnostic-${{ github.sha }}
          path: /tmp/partial-closure-allowlist-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
