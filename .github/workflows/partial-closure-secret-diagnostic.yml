name: Partial Closure Secret Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Annotate approved public evidence digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          digest = "6d0ed02c75960a3acf11073a2b7276e0bdc04f217fc99a488b15a5ff68e70775"
          paths = (
              Path("src/gemini_trading/cli/historical_validation.py"),
              Path("src/gemini_trading/strategy/handoff.py"),
              Path("tests/sealed_dataset_support.py"),
              Path("tests/acceptance/test_sealed_historical_validation_workflows.py"),
              Path("tests/acceptance/test_sealed_historical_validation_documentation.py"),
              Path("tests/integration/test_sealed_historical_validation.py"),
              Path("tests/unit/data/test_candle_exclusions.py"),
              Path("tests/unit/data/test_exchange_closures.py"),
          )
          for path in paths:
              lines = path.read_text().splitlines()
              matches = 0
              output: list[str] = []
              for line in lines:
                  if digest in line:
                      matches += 1
                      if "pragma: allowlist secret" not in line:
                          line += "  # pragma: allowlist secret"
                  output.append(line)
              if matches < 1:
                  raise SystemExit(f"approved digest not found in {path}")
              path.write_text("\n".join(output) + "\n")
          PY
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pre-commit run detect-secrets --all-files
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/gemini_trading/cli/historical_validation.py \
            src/gemini_trading/strategy/handoff.py \
            tests/sealed_dataset_support.py \
            tests/acceptance/test_sealed_historical_validation_workflows.py \
            tests/acceptance/test_sealed_historical_validation_documentation.py \
            tests/integration/test_sealed_historical_validation.py \
            tests/unit/data/test_candle_exclusions.py \
            tests/unit/data/test_exchange_closures.py
          git commit -m "chore: allowlist approved public evidence digest"
          git push origin "HEAD:${{ github.head_ref }}"
