name: Partial Closure Secret Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Apply structured public-digest allowlists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          digest = "6d0ed02c75960a3acf11073a2b7276e0bdc04f217fc99a488b15a5ff68e70775"
          pragma_literal = f'    "{digest}"  # pragma: allowlist secret'

          def replace_constant(path_text: str, name: str) -> None:
              path = Path(path_text)
              text = path.read_text()
              old = f'{name} = "{digest}"'
              new = f"{name} = (\n{pragma_literal}\n)"
              if text.count(old) != 1:
                  raise SystemExit(f"constant replacement mismatch: {path}:{name}")
              path.write_text(text.replace(old, new, 1))

          replace_constant(
              "src/gemini_trading/cli/historical_validation.py",
              "_EXPECTED_EXCLUDED_ROW_SHA256",
          )
          replace_constant("src/gemini_trading/strategy/handoff.py", "_PROVIDER_ROW_SHA256")
          replace_constant("tests/sealed_dataset_support.py", "_PROVIDER_ROW_SHA256")
          replace_constant(
              "tests/integration/test_sealed_historical_validation.py",
              "_APPROVED_ROW_SHA256",
          )
          replace_constant(
              "tests/unit/data/test_exchange_closures.py",
              "_APPROVED_ROW_SHA256",
          )

          workflow_test = Path(
              "tests/acceptance/test_sealed_historical_validation_workflows.py"
          )
          text = workflow_test.read_text()
          anchor = '_STUDY = _ROOT / ".github" / "workflows" / "sealed-btcusdt-study.yml"\n'
          constant = f"_APPROVED_ROW_SHA256 = (\n{pragma_literal}\n)\n"
          if text.count(anchor) != 1:
              raise SystemExit("workflow test constant anchor mismatch")
          text = text.replace(anchor, anchor + constant, 1)
          literal_assertion = f'    assert "{digest}" in text'
          if text.count(literal_assertion) != 1:
              raise SystemExit("workflow test digest assertion mismatch")
          workflow_test.write_text(
              text.replace(literal_assertion, "    assert _APPROVED_ROW_SHA256 in text", 1)
          )

          documentation_test = Path(
              "tests/acceptance/test_sealed_historical_validation_documentation.py"
          )
          text = documentation_test.read_text()
          anchor = '_README = _ROOT / "README.md"\n'
          if text.count(anchor) != 1:
              raise SystemExit("documentation test constant anchor mismatch")
          text = text.replace(anchor, anchor + constant, 1)
          list_literal = f'        "{digest}",'
          if text.count(list_literal) != 1:
              raise SystemExit("documentation test digest entry mismatch")
          documentation_test.write_text(
              text.replace(list_literal, "        _APPROVED_ROW_SHA256,", 1)
          )

          exclusion_test = Path("tests/unit/data/test_candle_exclusions.py")
          text = exclusion_test.read_text()
          anchor = "_TIMEFRAME = Timeframe.H4\n"
          if text.count(anchor) != 1:
              raise SystemExit("exclusion test constant anchor mismatch")
          text = text.replace(anchor, anchor + constant, 1)
          comparison = f'        == "{digest}"'
          if text.count(comparison) != 1:
              raise SystemExit("exclusion test digest comparison mismatch")
          exclusion_test.write_text(
              text.replace(comparison, "        == _APPROVED_ROW_SHA256", 1)
          )
          PY
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
          uv run pre-commit run detect-secrets --all-files
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/gemini_trading/cli/historical_validation.py \
            src/gemini_trading/strategy/handoff.py \
            tests/sealed_dataset_support.py \
            tests/acceptance/test_sealed_historical_validation_workflows.py \
            tests/acceptance/test_sealed_historical_validation_documentation.py \
            tests/integration/test_sealed_historical_validation.py \
            tests/unit/data/test_candle_exclusions.py \
            tests/unit/data/test_exchange_closures.py
          git commit -m "chore: allowlist approved public evidence digest"
          git push origin "HEAD:${{ github.head_ref }}"
