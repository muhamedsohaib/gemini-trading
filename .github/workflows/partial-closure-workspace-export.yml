name: Partial Closure Workspace Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Archive exact workspace
        shell: bash
        run: |
          python_root="$(python -c 'import sys; print(sys.base_prefix)')"
          tar -czf /tmp/partial-closure-repository.tgz \
            --exclude='./.venv' \
            --exclude='./dist' \
            --exclude='./build' \
            .
          tar -czf /tmp/partial-closure-venv.tgz .venv
          tar -czf /tmp/partial-closure-python-runtime.tgz -C "$python_root" .
          printf '%s\n' "$python_root" > /tmp/python-root.txt
          git rev-parse HEAD > /tmp/exported-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-repository-${{ github.sha }}
          path: |
            /tmp/partial-closure-repository.tgz
            /tmp/exported-head.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-venv-${{ github.sha }}
          path: /tmp/partial-closure-venv.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: partial-closure-python-runtime-${{ github.sha }}
          path: |
            /tmp/partial-closure-python-runtime.tgz
            /tmp/python-root.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
