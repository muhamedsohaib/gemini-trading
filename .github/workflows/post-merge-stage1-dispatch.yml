name: Post-Merge Stage 1 Dispatch

on:
  push:
    branches:
      - design/verified-partial-closure-candle-exclusion

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAIN_SHA: cf8389f6b8964b5aee0563083f8bf362be33b1ab
      MERGED_AT: 2026-07-26T20:44:39Z
      PR_NUMBER: "33"
    steps:
      - name: Verify main CI and identify official Stage 1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          main_sha="$(gh api "repos/${repo}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_sha}" = "${MAIN_SHA}"

          ci_run_id=""
          ci_conclusion=""
          for _ in $(seq 1 120); do
            response="$(gh api "repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${MAIN_SHA}&event=push&per_page=20")"
            ci_run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"${response}")"
            ci_status="$(jq -r '.workflow_runs[0].status // empty' <<<"${response}")"
            ci_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"${response}")"
            if [[ -n "${ci_run_id}" && "${ci_status}" == "completed" ]]; then
              break
            fi
            sleep 15
          done
          test -n "${ci_run_id}"
          test "${ci_conclusion}" = "success"

          response="$(gh api "repos/${repo}/actions/workflows/sealed-btcusdt-dataset.yml/runs?head_sha=${MAIN_SHA}&event=workflow_dispatch&per_page=20")"
          stage1_run_id="$(jq -r --arg after "${MERGED_AT}" '.workflow_runs | map(select(.created_at >= $after)) | .[0].id // empty' <<<"${response}")"
          dispatched="false"
          if [[ -z "${stage1_run_id}" ]]; then
            dispatched_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh api \
              --method POST \
              "repos/${repo}/actions/workflows/sealed-btcusdt-dataset.yml/dispatches" \
              -f ref=main
            dispatched="true"
            for _ in $(seq 1 80); do
              response="$(gh api "repos/${repo}/actions/workflows/sealed-btcusdt-dataset.yml/runs?head_sha=${MAIN_SHA}&event=workflow_dispatch&per_page=20")"
              stage1_run_id="$(jq -r --arg after "${dispatched_after}" '.workflow_runs | map(select(.created_at >= $after)) | .[0].id // empty' <<<"${response}")"
              if [[ -n "${stage1_run_id}" ]]; then
                break
              fi
              sleep 5
            done
          fi
          test -n "${stage1_run_id}"

          marker="<!-- post-merge-stage1-dispatch:${MAIN_SHA} -->"
          body="${marker}

          Post-merge verification and Stage 1 dispatch evidence.

          - Main commit: \`${MAIN_SHA}\`
          - Main CI run: \`${ci_run_id}\`
          - Main CI conclusion: \`${ci_conclusion}\`
          - Stage 1 run: \`${stage1_run_id}\`
          - Newly dispatched by this helper: \`${dispatched}\`
          - Boundary: \`RESEARCH_ONLY\`

          Stage 2 remains prohibited pending independent artifact review and explicit Issue #22 approval."
          gh api --method POST "repos/${repo}/issues/${PR_NUMBER}/comments" -f body="${body}" > /dev/null

          mkdir -p /tmp/post-merge-stage1
          jq -n \
            --arg main_sha "${MAIN_SHA}" \
            --argjson main_ci_run_id "${ci_run_id}" \
            --arg main_ci_conclusion "${ci_conclusion}" \
            --argjson stage1_run_id "${stage1_run_id}" \
            --arg dispatched "${dispatched}" \
            '{main_sha:$main_sha,main_ci_run_id:$main_ci_run_id,main_ci_conclusion:$main_ci_conclusion,stage1_run_id:$stage1_run_id,dispatched:($dispatched=="true")}' \
            > /tmp/post-merge-stage1/report.json
          cat /tmp/post-merge-stage1/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-merge-stage1-dispatch-${{ github.run_id }}
          path: /tmp/post-merge-stage1/report.json
          if-no-files-found: error
          retention-days: 1
