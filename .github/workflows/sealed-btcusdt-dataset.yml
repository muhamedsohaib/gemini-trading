name: Sealed BTCUSDT Dataset

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_TRADING_MODE: research
      OUTPUT_ROOT: /tmp/sealed-output
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Assert exact clean merged-main commit
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: Ingest fixed BTCUSDT history
        id: ingest
        run: |
          uv run gemini-trading research dataset-ingest \
            --project-root "${GITHUB_WORKSPACE}" \
            --output-root "${OUTPUT_ROOT}" | tee "${RUNNER_TEMP}/ingest.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ingest.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"run_id={payload['run_id']}\n")
              output.write(f"dataset_id={payload['dataset_id']}\n")
          PY
      - name: Replay stored dataset evidence
        env:
          EXPECTED_RUN_ID: ${{ steps.ingest.outputs.run_id }}
          EXPECTED_DATASET_ID: ${{ steps.ingest.outputs.dataset_id }}
        run: |
          uv run gemini-trading research dataset-replay \
            --run-id "${EXPECTED_RUN_ID}" \
            --output-root "${OUTPUT_ROOT}" | tee "${RUNNER_TEMP}/replay.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "replay.json").read_text())
          if payload.get("status") != "completed":
              raise SystemExit("dataset replay did not complete")
          if payload.get("run_id") != os.environ["EXPECTED_RUN_ID"]:
              raise SystemExit("dataset replay run identity mismatch")
          if payload.get("dataset_id") != os.environ["EXPECTED_DATASET_ID"]:
              raise SystemExit("dataset replay dataset identity mismatch")
          PY
      - name: Independently verify dataset
        run: |
          uv run gemini-trading research dataset-verify \
            --dataset-id "${{ steps.ingest.outputs.dataset_id }}" \
            --run-id "${{ steps.ingest.outputs.run_id }}" \
            --output-root "${OUTPUT_ROOT}" | tee "${RUNNER_TEMP}/verify.json"
      - name: Build verified dataset handoff
        run: |
          uv run gemini-trading research strategy-handoff \
            --run-id "${{ steps.ingest.outputs.run_id }}" \
            --dataset-id "${{ steps.ingest.outputs.dataset_id }}" \
            --source-commit "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-root "${OUTPUT_ROOT}" | tee "${RUNNER_TEMP}/handoff.json"
      - name: Assert exact v4 handoff identity
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from gemini_trading.strategy.handoff import load_dataset_handoff
          from gemini_trading.strategy.sealed_dataset_identity import (
              assert_fixed_sealed_dataset_identity,
          )

          root = Path(os.environ["OUTPUT_ROOT"])
          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "handoff.json").read_text())
          handoff = load_dataset_handoff((root / payload["handoff_path"]).read_bytes())
          assert_fixed_sealed_dataset_identity(handoff)
          PY
      - name: Assert worktree stayed clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        with:
          name: sealed-btcusdt-dataset-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/sealed-output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
