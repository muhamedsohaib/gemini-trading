name: Task 9 Lock Repair

on:
  push:
    branches:
      - feature/economic-data-fabric-v1

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'chore: upgrade locked pip past PYSEC-2026-3721'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: feature/economic-data-fabric-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Upgrade locked pip only
        run: uv lock --upgrade-package pip
      - name: Verify frozen environment and audit
        run: |
          uv sync --all-groups --frozen
          uv run pip-audit
      - name: Commit lock repair when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already resolves a non-vulnerable pip version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: upgrade locked pip past PYSEC-2026-3721"
          git push origin HEAD:feature/economic-data-fabric-v1
