name: Temporary dispatch fresh Stage 1 c4c9ce9d

on:
  pull_request:

permissions:
  actions: write
  contents: read
  issues: write

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'ops/dispatch-stage1-c4c9ce9d'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: c4c9ce9d62a4fba8aab3795598be9b54cb50aa5d
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Assert current main is exact verified commit
        run: |
          ACTUAL_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${ACTUAL_MAIN_SHA}" = "${EXPECTED_MAIN_SHA}"
      - name: Dispatch fresh Stage 1 from main
        id: dispatch
        run: |
          BEFORE_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sealed-btcusdt-dataset.yml/runs?event=workflow_dispatch&branch=main&per_page=30" --jq '[.workflow_runs[].id] | join(" ")')"
          gh workflow run sealed-btcusdt-dataset.yml --ref main
          for _ in $(seq 1 30); do
            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sealed-btcusdt-dataset.yml/runs?event=workflow_dispatch&branch=main&per_page=30")"
            RUN_ID="$(printf '%s' "${RUN_JSON}" | jq -r --arg sha "${EXPECTED_MAIN_SHA}" --arg before " ${BEFORE_IDS} " '[.workflow_runs[] | select(.head_sha == $sha) | select(($before | contains(" " + (.id|tostring) + " ")) | not)][0].id // empty')"
            if [ -n "${RUN_ID}" ]; then
              echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
              echo "Fresh Stage 1 run: ${RUN_ID}"
              exit 0
            fi
            sleep 2
          done
          echo "Unable to identify newly dispatched Stage 1 run" >&2
          exit 1
      - name: Record dispatch in Issue 22
        run: |
          gh issue comment 22 --body "Fresh Stage 1 dispatched after exact-main verification. Source commit: \`${EXPECTED_MAIN_SHA}\`. Stage 1 workflow run: \`${{ steps.dispatch.outputs.run_id }}\`. This is dataset production only; no dataset approval or Stage 2 authorization is implied. Boundary: \`RESEARCH_ONLY\`."
