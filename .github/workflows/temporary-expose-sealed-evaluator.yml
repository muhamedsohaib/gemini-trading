name: Temporary expose sealed evaluator

on:
  push:
    branches: [research/sealed-btcusdt-historical-validation]

permissions:
  contents: write

jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/sealed-btcusdt-historical-validation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Expose sealed APIs and format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gemini_trading/strategy/evaluator.py')
          text = path.read_text()
          marker = '''from gemini_trading.strategy.study_strategy import (
              ReplayableStudyStrategy,
              reconstruct_study_strategy,
          )
          '''
          if 'from gemini_trading.strategy.sealed_evaluator import (' not in text:
              addition = marker + '''from gemini_trading.strategy.sealed_evaluator import (
                  complete_candidate_strategy_study,
                  final_access_identity,
                  prepare_candidate_strategy_study,
              )
              '''
              if marker not in text:
                  raise SystemExit('import marker not found')
              text = text.replace(marker, addition, 1)
          old = '''__all__ = [
              "ReplayableStudyStrategy",
              "evaluate_candidate_strategy_study",
              "reconstruct_study_strategy",
          ]
          '''
          new = '''__all__ = [
              "ReplayableStudyStrategy",
              "complete_candidate_strategy_study",
              "evaluate_candidate_strategy_study",
              "final_access_identity",
              "prepare_candidate_strategy_study",
              "reconstruct_study_strategy",
          ]
          '''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/integration/test_sealed_historical_validation.py')
          text = test.read_text()
          if 'from datetime import timedelta\n' not in text:
              text = text.replace(
                  'from dataclasses import dataclass\n',
                  'from dataclasses import dataclass\nfrom datetime import timedelta\n',
              )
          text = text.replace(
              'end_time=candles[-1].close_time.replace(microsecond=0),',
              'end_time=candles[-1].close_time + timedelta(milliseconds=1),',
          )
          test.write_text(text)
          PY
          rm -f reports/verification/sealed-validation-pyright-diagnostic.txt
          uv run ruff format .
          git rm .github/workflows/temporary-expose-sealed-evaluator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose sealed candidate evaluation phases"
          git push origin HEAD:research/sealed-btcusdt-historical-validation
