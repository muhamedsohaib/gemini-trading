name: Temporary Apply Handoff Path Correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Reject normalized noncanonical paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/gemini_trading/strategy/handoff.py")
          text = path.read_text()
          target = '        not value\n        or "\\\\" in value\n'
          replacement = '        not value\n        or value != path.as_posix()\n        or "\\\\" in value\n'
          if target not in text:
              raise SystemExit("handoff path validator target changed")
          path.write_text(text.replace(target, replacement, 1))
          PY
      - run: uv run ruff format .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest tests/unit/strategy/test_handoff.py tests/unit/strategy -q
      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-failed-test-diagnostic.yml
          git add src tests
          git commit -m "fix: reject noncanonical handoff paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
