name: Temporary fix sealed validation types

on:
  push:
    branches: [research/sealed-btcusdt-historical-validation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/sealed-btcusdt-historical-validation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Apply concrete public interfaces
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          sealed = Path('src/gemini_trading/strategy/sealed_evaluator.py')
          text = sealed.read_text()
          text = text.replace('from collections.abc import Mapping, Protocol\n', 'from collections.abc import Mapping\n')
          text = text.replace(
              'from gemini_trading.strategy.features import FeatureMatrix, FeatureRegistry\n',
              'from gemini_trading.strategy.evaluation import PromotionReport\nfrom gemini_trading.strategy.features import FeatureMatrix, FeatureRegistry\n',
          )
          text, count = re.subn(
              r'\nclass DatasetHandoffReference\(Protocol\):.*?\n\n@dataclass',
              '\n@dataclass',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('handoff protocol block not found')
          text = text.replace('DatasetHandoffReference', 'DatasetHandoffManifest')
          text = text.replace('cast(DatasetHandoffManifest, handoff)', 'handoff')
          text = text.replace(') -> tuple[dict[str, object], object]:', ') -> tuple[dict[str, object], PromotionReport]:')
          text = text.replace('def _build_preparation(', 'def build_candidate_preparation(')
          text = text.replace('_build_preparation(', 'build_candidate_preparation(')
          text = text.replace('    "DatasetHandoffManifest",\n', '')
          text = text.replace('    "_build_preparation",\n', '')
          if '    "build_candidate_preparation",\n' not in text:
              text = text.replace(
                  '    "CandidatePreparation",\n',
                  '    "CandidatePreparation",\n    "build_candidate_preparation",\n',
              )
          sealed.write_text(text)

          evaluator = Path('src/gemini_trading/strategy/evaluator.py')
          text = evaluator.read_text()
          text = text.replace(
              '    complete_candidate_strategy_study,\n',
              '    build_candidate_preparation,\n    complete_candidate_strategy_study,\n',
          )
          text = text.replace(
              '    "complete_candidate_strategy_study",\n',
              '    "build_candidate_preparation",\n    "complete_candidate_strategy_study",\n',
          )
          evaluator.write_text(text)

          worker = Path('tests/candidate_strategy_e2e_worker.py')
          text = worker.read_text()
          if 'def synthetic_candidate_candles(' not in text:
              text += '''\n\ndef synthetic_candidate_candles():\n    """Return the deterministic synthetic Candidate acceptance candles."""\n\n    return _synthetic_candles()\n'''
          worker.write_text(text)

          integration = Path('tests/integration/test_sealed_historical_validation.py')
          text = integration.read_text()
          text = text.replace(
              'from candidate_strategy_e2e_worker import _synthetic_candles\n',
              'from candidate_strategy_e2e_worker import synthetic_candidate_candles\n',
          )
          text = text.replace(
              '    _build_preparation,\n',
              '    build_candidate_preparation,\n',
          )
          text = text.replace('_synthetic_candles()', 'synthetic_candidate_candles()')
          text = text.replace('_build_preparation(', 'build_candidate_preparation(')
          integration.write_text(text)

          cli = Path('src/gemini_trading/cli/historical_validation.py')
          text = cli.read_text()
          text = text.replace(
              'from gemini_trading.strategy.pre_final import LocalPreFinalStore, verify_pre_final_artifacts\n',
              'from gemini_trading.strategy.pre_final import (\n    LocalPreFinalStore,\n    PreFinalArtifacts,\n    verify_pre_final_artifacts,\n)\n',
          )
          text = text.replace(
              'def _fixed_config_path(arguments: argparse.Namespace, project_root: Path) -> Path:',
              'def resolve_locked_candidate_config(\n    arguments: argparse.Namespace, project_root: Path\n) -> Path:',
          )
          text = text.replace('_fixed_config_path(arguments, project_root)', 'resolve_locked_candidate_config(arguments, project_root)')
          text = text.replace(
              'def _pre_final_identity(output_root: Path, pre_final_id: str) -> tuple[object, dict[str, object]]:',
              'def _pre_final_identity(\n    output_root: Path, pre_final_id: str\n) -> tuple[PreFinalArtifacts, dict[str, object]]:',
          )
          text = text.replace('__all__ = ["run_historical_validation"]', '__all__ = ["resolve_locked_candidate_config", "run_historical_validation"]')
          cli.write_text(text)

          main = Path('src/gemini_trading/cli/main.py')
          text = main.read_text()
          text = text.replace('def _build_parser() -> SafeArgumentParser:', 'def build_parser() -> SafeArgumentParser:')
          text = text.replace('_build_parser()', 'build_parser()')
          main.write_text(text)

          cli_test = Path('tests/unit/cli/test_historical_validation.py')
          text = cli_test.read_text()
          text = text.replace(
              'from gemini_trading.cli.historical_validation import run_historical_validation\n',
              'from gemini_trading.cli.historical_validation import (\n    resolve_locked_candidate_config,\n    run_historical_validation,\n)\n',
          )
          text = text.replace('from gemini_trading.cli.main import _build_parser, main\n', 'from gemini_trading.cli.main import build_parser, main\n')
          text = text.replace('_build_parser()', 'build_parser()')
          text = text.replace('historical_validation._fixed_config_path(arguments, project_root)', 'resolve_locked_candidate_config(arguments, project_root)')
          cli_test.write_text(text)
          PY
          rm -f reports/verification/sealed-validation-pyright-final.txt
          uv run ruff check --fix . || true
          uv run ruff format .
          uv run pyright
          git rm .github/workflows/temporary-fix-sealed-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use concrete sealed validation interfaces"
          git push origin HEAD:research/sealed-btcusdt-historical-validation
