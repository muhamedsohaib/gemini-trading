name: Temporary focused Task 5 and Task 6

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py
      - run: uv run pyright src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py
      - run: uv run pytest tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py -q
      - run: uv run pytest tests/unit/data/ingestion/test_service_v4.py -q
