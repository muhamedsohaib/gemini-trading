name: Temporary Pyright Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Capture Pyright output
        run: |
          set +e
          uv run pyright > "${RUNNER_TEMP}/pyright.txt" 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-pyright-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/pyright.txt
          if-no-files-found: error
          retention-days: 1
