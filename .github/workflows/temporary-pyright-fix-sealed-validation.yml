name: Temporary Pyright fix sealed validation

on:
  push:
    branches: [research/sealed-btcusdt-historical-validation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/sealed-btcusdt-historical-validation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Apply typed corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          pre_final = Path('src/gemini_trading/strategy/pre_final.py')
          text = pre_final.read_text()
          old = '''    for raw_pair in cast(list[object], raw_hashes):
                  if not isinstance(raw_pair, list) or len(raw_pair) != 2:
                      raise PreFinalArtifactError("invalid pre-final artifact hash inventory")
                  name, digest = cast(list[object], raw_pair)
          '''
          new = '''    for raw_pair in cast(list[object], raw_hashes):
                  if not isinstance(raw_pair, list):
                      raise PreFinalArtifactError("invalid pre-final artifact hash inventory")
                  pair = cast(list[object], raw_pair)
                  if len(pair) != 2:
                      raise PreFinalArtifactError("invalid pre-final artifact hash inventory")
                  name, digest = pair
          '''
          if old not in text:
              raise SystemExit('pre_final target not found')
          pre_final.write_text(text.replace(old, new))

          test = Path('tests/unit/strategy/test_handoff.py')
          text = test.read_text()
          text = text.replace('from pathlib import Path\n', 'from dataclasses import replace\nfrom pathlib import Path\n')
          old = '''    with pytest.raises(DatasetHandoffError, match="market scope"):
                  DatasetHandoffManifest(
                      **{
                          "schema_version": "sealed-dataset-handoff-v1",
                          "repository": "muhamedsohaib/gemini-trading",
                          "source_commit": "a" * 40,
                          "workflow_name": "sealed-btcusdt-dataset",
                          "workflow_run_id": 123,
                          "workflow_run_attempt": 1,
                          "job_name": "dataset",
                          "provider": "binance_spot",
                          "symbol": "ETHUSDT",
                          "base_asset": "BTC",
                          "quote_asset": "USDT",
                          "interval": "4h",
                          "start": "2018-01-01T00:00:00Z",
                          "end_exclusive": "2026-07-01T00:00:00Z",
                          "run_id": "run-123",
                          "dataset_id": "b" * 64,
                          "candle_count": 18_618,
                          "first_open_time": "2018-01-01T00:00:00Z",
                          "last_open_time": "2026-06-30T20:00:00Z",
                          "replay_status": "completed",
                          "verification_status": "verified",
                          "files": entries,
                          "inventory_root_sha256": inventory_root_sha256(entries),
                      }
                  )
          '''
          new = '''    with pytest.raises(DatasetHandoffError, match="market scope"):
                  replace(_manifest(entries), symbol="ETHUSDT")
          '''
          if old not in text:
              raise SystemExit('test_handoff target not found')
          test.write_text(text.replace(old, new))
          PY
          rm reports/verification/sealed-validation-pyright-diagnostic.txt
          uv run ruff format .
          uv run ruff check .
          uv run pyright
          git rm .github/workflows/temporary-pyright-fix-sealed-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy sealed validation type checks"
          git push origin HEAD:research/sealed-btcusdt-historical-validation
