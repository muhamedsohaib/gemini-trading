name: Temporary repair repository seal

on:
  push:
    branches: [research/sealed-btcusdt-historical-validation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/sealed-btcusdt-historical-validation
          fetch-depth: 0
      - name: Repair repository-seal YAML
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/sealed-btcusdt-study.yml')
          text = path.read_text()
          first = '''          echo "comment_id=${COMMENT_ID}" >> "${GITHUB_OUTPUT}"
                    mkdir -p "${OUTPUT_ROOT}/data/historical-validation/repository-seal"
          '''
          second = '''          echo "comment_id=${COMMENT_ID}" >> "${GITHUB_OUTPUT}"
                    export COMMENT_ID
                    mkdir -p "${OUTPUT_ROOT}/data/historical-validation/repository-seal"
          '''
          if first not in text:
              raise SystemExit('comment export target missing')
          text = text.replace(first, second, 1)
          duplicate = '''          PY
                env:
                  COMMENT_ID: ${{ steps.repository-seal.outputs.comment_id }}
              - name: Persist final-test access receipt
          '''
          replacement = '''          PY
              - name: Persist final-test access receipt
          '''
          if duplicate not in text:
              raise SystemExit('duplicate env target missing')
          path.write_text(text.replace(duplicate, replacement, 1))
          PY
          git rm -f .github/workflows/temporary-fix-repository-seal.yml
          git rm .github/workflows/temporary-repair-repository-seal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair repository seal workflow YAML"
          git push origin HEAD:research/sealed-btcusdt-historical-validation
