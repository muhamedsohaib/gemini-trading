name: Temporary Ruff Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Show exact Ruff formatting diff
        run: |
          uv run ruff format \
            src/gemini_trading/cli/candidate_v0_2.py \
            tests/acceptance/test_candidate_v0_2_workflow.py \
            tests/unit/strategy/test_qualification_verification.py
          git diff -- \
            src/gemini_trading/cli/candidate_v0_2.py \
            tests/acceptance/test_candidate_v0_2_workflow.py \
            tests/unit/strategy/test_qualification_verification.py
          test -z "$(git status --porcelain)"
