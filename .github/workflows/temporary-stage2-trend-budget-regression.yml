name: Verify Stage2 Trend Budget Regression

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  focused:
    if: github.event.pull_request.head.ref == 'fix/stage2-trend-max-iterations-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Run approved trend solver budget contract
        run: uv run pytest tests/unit/strategy/test_policy.py::test_locked_policy_matches_approved_spec -q
