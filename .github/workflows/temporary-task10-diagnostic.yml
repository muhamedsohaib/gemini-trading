name: Temporary Task 10 diagnostic

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  diagnose-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Apply patch and capture all statuses
        run: |
          set +e
          {
            echo '=== PATCH ==='
            uv run python scripts/temporary_task10_patch.py
            patch_status=$?
            echo "patch_status=$patch_status"
            if [ "$patch_status" -eq 0 ]; then
              echo '=== FORMAT ==='
              uv run ruff format src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
              echo "format_status=$?"
              echo '=== RUFF ==='
              uv run ruff check src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
              echo "ruff_status=$?"
              echo '=== PYRIGHT ==='
              uv run pyright src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
              echo "pyright_status=$?"
              echo '=== PYTEST ==='
              uv run pytest tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py -q
              echo "pytest_status=$?"
            fi
          } > task10-verification.txt 2>&1
          set -e
      - name: Commit patched files and diagnostic
        run: |
          git rm .github/workflows/temporary-task10-diagnostic.yml scripts/temporary_task10_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py task10-verification.txt
          git commit -m "chore: capture Task 10 verification results"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
