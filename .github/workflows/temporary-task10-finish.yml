name: Temporary Task 10 finish

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  finish-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/temporary_task10_finish.py
      - run: uv run ruff format src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
      - run: uv run ruff check src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
      - run: uv run pyright src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
      - run: uv run pytest tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py -q
      - name: Commit Task 10 completion
        run: |
          git rm .github/workflows/temporary-task10-finish.yml scripts/temporary_task10_finish.py task10-verification.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/strategy/pre_final.py src/gemini_trading/strategy/replay.py src/gemini_trading/strategy/sealed_evaluator.py src/gemini_trading/strategy/sealed_verification.py tests/unit/strategy/test_pre_final.py tests/unit/strategy/test_sealed_manifest_identity.py
          git commit -m "feat: bind sealed study evidence to handoff v4"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
