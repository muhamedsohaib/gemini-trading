name: Temporary Task 5 GREEN patch

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  implement-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Add dataset v4 identity and manifest semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          domain_path = Path("src/gemini_trading/domain/dataset.py")
          domain = domain_path.read_text(encoding="utf-8")
          domain_replacements = (
              (
                  'sealed_versions = {"candle-dataset-v2", "candle-dataset-v3"}',
                  'sealed_versions = {"candle-dataset-v2", "candle-dataset-v3", "candle-dataset-v4"}',
              ),
              (
                  'if self.schema_version == "candle-dataset-v3":',
                  'if self.schema_version in {"candle-dataset-v3", "candle-dataset-v4"}:',
              ),
              (
                  'raise ValueError("candle-dataset-v3 requires exclusion manifest identity")',
                  'raise ValueError(f"{self.schema_version} requires exclusion manifest identity")',
              ),
              (
                  'raise ValueError("candle-dataset-v3 exclusion count must match closure count")',
                  'raise ValueError(f"{self.schema_version} exclusion count must match closure count")',
              ),
              (
                  'raise ValueError("exclusion evidence is only valid for candle-dataset-v3")',
                  'raise ValueError("exclusion evidence is only valid for sealed dataset v3 or v4")',
              ),
          )
          for old, new in domain_replacements:
              if old not in domain:
                  raise SystemExit(f"missing domain anchor: {old}")
              domain = domain.replace(old, new)
          domain_path.write_text(domain, encoding="utf-8")

          writer_path = Path("src/gemini_trading/data/datasets/canonical_writer.py")
          writer = writer_path.read_text(encoding="utf-8")
          function_anchor = '\n\ndef build_dataset_manifest(\n'
          if function_anchor not in writer:
              raise SystemExit("missing dataset builder anchor")
          v4_function = '''

def dataset_id_v4(
    *,
    provider: str,
    instrument: Instrument,
    timeframe: Timeframe,
    start_time: datetime,
    end_time: datetime,
    canonical_bytes: bytes,
    closure_manifest_bytes: bytes,
    exclusion_manifest_bytes: bytes,
    segment_manifest_bytes: bytes,
) -> str:
    """Bind canonical candles and every sealed supporting manifest into v4 identity."""

    identity = {
        "schema_version": "candle-dataset-v4",
        "provider": provider,
        "instrument": {
            "symbol": instrument.symbol,
            "base_asset": instrument.base_asset,
            "quote_asset": instrument.quote_asset,
        },
        "timeframe": timeframe.value,
        "start_time": _utc_iso(start_time),
        "end_time": _utc_iso(end_time),
        "canonical_sha256": _sha256(canonical_bytes),
        "closure_manifest_sha256": _sha256(closure_manifest_bytes),
        "exclusion_manifest_sha256": _sha256(exclusion_manifest_bytes),
        "segment_manifest_sha256": _sha256(segment_manifest_bytes),
    }
    return _sha256(_canonical_json_bytes(identity))
'''
          writer = writer.replace(function_anchor, v4_function + function_anchor, 1)
          writer_replacements = (
              (
                  'sealed_versions = {"candle-dataset-v2", "candle-dataset-v3"}',
                  'sealed_versions = {"candle-dataset-v2", "candle-dataset-v3", "candle-dataset-v4"}',
              ),
              (
                  'if schema_version == "candle-dataset-v3":',
                  'if schema_version in {"candle-dataset-v3", "candle-dataset-v4"}:',
              ),
              (
                  'raise ValueError("candle-dataset-v3 requires exclusion manifest bytes")',
                  'raise ValueError(f"{schema_version} requires exclusion manifest bytes")',
              ),
              (
                  'raise ValueError("candle-dataset-v3 exclusion count must match closure count")',
                  'raise ValueError(f"{schema_version} exclusion count must match closure count")',
              ),
              (
                  'if manifest.schema_version in {"candle-dataset-v2", "candle-dataset-v3"}:',
                  'if manifest.schema_version in {"candle-dataset-v2", "candle-dataset-v3", "candle-dataset-v4"}:',
              ),
              (
                  'if manifest.schema_version == "candle-dataset-v3":',
                  'if manifest.schema_version in {"candle-dataset-v3", "candle-dataset-v4"}:',
              ),
          )
          for old, new in writer_replacements:
              if old not in writer:
                  raise SystemExit(f"missing writer anchor: {old}")
              writer = writer.replace(old, new)

          old_identity = '''    if schema_version == "candle-dataset-v3":
        assert closure_manifest_bytes is not None
        assert exclusion_manifest_bytes is not None
        assert segment_manifest_bytes is not None
        identity = dataset_id_v3(
            provider=provider,
            instrument=instrument,
            timeframe=timeframe,
            start_time=start_time,
            end_time=end_time,
            canonical_bytes=canonical_bytes,
            closure_manifest_bytes=closure_manifest_bytes,
            exclusion_manifest_bytes=exclusion_manifest_bytes,
            segment_manifest_bytes=segment_manifest_bytes,
        )
    elif schema_version == "candle-dataset-v2":
'''
          new_identity = '''    if schema_version == "candle-dataset-v4":
        assert closure_manifest_bytes is not None
        assert exclusion_manifest_bytes is not None
        assert segment_manifest_bytes is not None
        identity = dataset_id_v4(
            provider=provider,
            instrument=instrument,
            timeframe=timeframe,
            start_time=start_time,
            end_time=end_time,
            canonical_bytes=canonical_bytes,
            closure_manifest_bytes=closure_manifest_bytes,
            exclusion_manifest_bytes=exclusion_manifest_bytes,
            segment_manifest_bytes=segment_manifest_bytes,
        )
    elif schema_version == "candle-dataset-v3":
        assert closure_manifest_bytes is not None
        assert exclusion_manifest_bytes is not None
        assert segment_manifest_bytes is not None
        identity = dataset_id_v3(
            provider=provider,
            instrument=instrument,
            timeframe=timeframe,
            start_time=start_time,
            end_time=end_time,
            canonical_bytes=canonical_bytes,
            closure_manifest_bytes=closure_manifest_bytes,
            exclusion_manifest_bytes=exclusion_manifest_bytes,
            segment_manifest_bytes=segment_manifest_bytes,
        )
    elif schema_version == "candle-dataset-v2":
'''
          if old_identity not in writer:
              raise SystemExit("missing identity selection anchor")
          writer = writer.replace(old_identity, new_identity)
          writer_path.write_text(writer, encoding="utf-8")
          PY
      - run: uv run ruff format src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py
      - run: uv run ruff check src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py
      - run: uv run pyright src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py
      - run: uv run pytest tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py -q
      - name: Remove helper and commit GREEN implementation
        run: |
          git rm .github/workflows/temporary-task5-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/domain/dataset.py
          git add src/gemini_trading/data/datasets/canonical_writer.py
          git add tests/unit/data/datasets/test_canonical_writer_v4.py
          git commit -m "feat: add sealed candle dataset v4 identity"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
