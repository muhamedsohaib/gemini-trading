name: Temporary Task 5 RED contract

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  add-red-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Append v4 contract tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/data/datasets/test_canonical_writer.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_v4_dataset_identity_binds_every_supporting_byte_stream()"
          if marker in text:
              raise SystemExit("Task 5 tests already exist")
          block = r'''


def test_v4_dataset_identity_binds_every_supporting_byte_stream() -> None:
    from gemini_trading.data.datasets.canonical_writer import dataset_id_v4

    inputs = {
        "provider": "binance_spot",
        "instrument": _INSTRUMENT,
        "timeframe": Timeframe.H4,
        "start_time": _START,
        "end_time": _END,
        "canonical_bytes": serialize_candles((_candle(),)),
        "closure_manifest_bytes": b'{"closures":[1,2]}\n',
        "exclusion_manifest_bytes": b'{"exclusions":[1,2]}\n',
        "segment_manifest_bytes": b'{"segments":[1,2,3]}\n',
    }
    identity = dataset_id_v4(**inputs)

    assert dataset_id_v4(**inputs) == identity
    for field in (
        "canonical_bytes",
        "closure_manifest_bytes",
        "exclusion_manifest_bytes",
        "segment_manifest_bytes",
    ):
        changed = dict(inputs)
        value = changed[field]
        assert isinstance(value, bytes)
        changed[field] = value + b" "
        assert dataset_id_v4(**changed) != identity


def test_build_and_serialize_v4_manifest_binds_all_evidence() -> None:
    from gemini_trading.data.datasets.canonical_writer import dataset_id_v4

    candles = (_candle(),)
    canonical = serialize_candles(candles)
    closure = b'{"closures":[1,2]}\n'
    exclusions = b'{"exclusions":[1,2]}\n'
    segments = b'{"segments":[1,2,3]}\n'
    manifest = build_dataset_manifest(
        schema_version="candle-dataset-v4",
        provider="binance_spot",
        instrument=_INSTRUMENT,
        timeframe=Timeframe.H4,
        start_time=_START,
        end_time=_END,
        candles=candles,
        canonical_bytes=canonical,
        closure_manifest_bytes=closure,
        exclusion_manifest_bytes=exclusions,
        segment_manifest_bytes=segments,
        closure_count=2,
        exclusion_count=2,
        segment_count=3,
    )

    assert manifest.dataset_id == dataset_id_v4(
        provider="binance_spot",
        instrument=_INSTRUMENT,
        timeframe=Timeframe.H4,
        start_time=_START,
        end_time=_END,
        canonical_bytes=canonical,
        closure_manifest_bytes=closure,
        exclusion_manifest_bytes=exclusions,
        segment_manifest_bytes=segments,
    )
    encoded = serialize_dataset_manifest(manifest)
    assert b'"schema_version":"candle-dataset-v4"' in encoded
    assert b'"closure_manifest_sha256":"' in encoded
    assert b'"exclusion_manifest_sha256":"' in encoded
    assert b'"segment_manifest_sha256":"' in encoded
    assert b'"closure_count":2' in encoded
    assert b'"exclusion_count":2' in encoded
    assert b'"segment_count":3' in encoded


@pytest.mark.parametrize(
    ("closure_count", "exclusion_count", "segment_count", "message"),
    [
        (2, 1, 3, "exclusion_count"),
        (2, 2, 2, "segment_count"),
    ],
)
def test_v4_manifest_rejects_inconsistent_supporting_counts(
    closure_count: int,
    exclusion_count: int,
    segment_count: int,
    message: str,
) -> None:
    canonical = serialize_candles((_candle(),))
    with pytest.raises(ValueError, match=message):
        build_dataset_manifest(
            schema_version="candle-dataset-v4",
            provider="binance_spot",
            instrument=_INSTRUMENT,
            timeframe=Timeframe.H4,
            start_time=_START,
            end_time=_END,
            candles=(_candle(),),
            canonical_bytes=canonical,
            closure_manifest_bytes=b"{}\n",
            exclusion_manifest_bytes=b"{}\n",
            segment_manifest_bytes=b"{}\n",
            closure_count=closure_count,
            exclusion_count=exclusion_count,
            segment_count=segment_count,
        )


def test_v4_manifest_requires_exclusion_evidence() -> None:
    canonical = serialize_candles((_candle(),))
    with pytest.raises(ValueError, match="exclusion manifest"):
        build_dataset_manifest(
            schema_version="candle-dataset-v4",
            provider="binance_spot",
            instrument=_INSTRUMENT,
            timeframe=Timeframe.H4,
            start_time=_START,
            end_time=_END,
            candles=(_candle(),),
            canonical_bytes=canonical,
            closure_manifest_bytes=b"{}\n",
            segment_manifest_bytes=b"{}\n",
            closure_count=1,
            exclusion_count=1,
            segment_count=2,
        )
'''
          path.write_text(text + block, encoding="utf-8")
          PY
      - run: uv run ruff format tests/unit/data/datasets/test_canonical_writer.py
      - name: Require focused RED failure
        run: |
          set +e
          output="$(uv run pytest tests/unit/data/datasets/test_canonical_writer.py -q 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "dataset_id_v4" <<<"$output"
      - name: Remove helper and commit tests only
        run: |
          git rm .github/workflows/temporary-task5-red-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/data/datasets/test_canonical_writer.py
          git commit -m "test: define candle dataset v4 identity contract"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
