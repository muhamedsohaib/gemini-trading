name: Temporary Task 6 GREEN

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  implement-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Publish sealed ingestion as v4
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/gemini_trading/data/ingestion/service.py")
          text = path.read_text(encoding="utf-8")
          old_constant = '_DATASET_SCHEMA_VERSION_V3 = "candle-dataset-v3"'
          old_use = "_DATASET_SCHEMA_VERSION_V3\n                    if self._closure_manifest"
          if text.count(old_constant) != 1 or text.count(old_use) != 1:
              raise SystemExit("unexpected ingestion v3 schema structure")
          text = text.replace(
              old_constant,
              '_DATASET_SCHEMA_VERSION_V4 = "candle-dataset-v4"',
              1,
          )
          text = text.replace(
              old_use,
              "_DATASET_SCHEMA_VERSION_V4\n                    if self._closure_manifest",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff format --check src/gemini_trading/data/ingestion/service.py tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py
      - run: uv run ruff check src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py src/gemini_trading/data/ingestion/service.py tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py
      - run: uv run pyright src/gemini_trading/domain/dataset.py src/gemini_trading/data/datasets/canonical_writer.py src/gemini_trading/data/ingestion/service.py tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py
      - run: uv run pytest tests/unit/data/datasets/test_canonical_writer.py tests/unit/data/datasets/test_canonical_writer_v4.py tests/unit/data/ingestion/test_service_v4.py -q
      - name: Commit verified Task 6 implementation
        run: |
          git rm .github/workflows/temporary-task6-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/data/ingestion/service.py
          git commit -m "feat: publish multi-closure dataset v4"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
