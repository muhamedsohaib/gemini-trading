name: Temporary Task 7 test formatting

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check --fix tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run ruff format tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run ruff check tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run pyright tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py tests/integration/test_market_data_exchange_closure_v4.py
      - name: Commit formatted tests
        run: |
          git rm .github/workflows/temporary-task7-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/market_data/multi_closure_ingestion.py tests/unit/data/ingestion/test_service_v4.py tests/integration/test_market_data_exchange_closure_v4.py
          git commit -m "test: format replay and verification v4 contract"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
