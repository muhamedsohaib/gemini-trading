name: Temporary Task 7 GREEN

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  implement-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Upgrade replay and verification to v4
        run: |
          python - <<'PY'
          from pathlib import Path

          replay_path = Path("src/gemini_trading/data/ingestion/replay.py")
          replay = replay_path.read_text(encoding="utf-8")
          replay_constant = '_DATASET_SCHEMA_VERSION_V3 = "candle-dataset-v3"'
          replay_use = "_DATASET_SCHEMA_VERSION_V3\n                if closure_manifest"
          if replay.count(replay_constant) != 1 or replay.count(replay_use) != 1:
              raise SystemExit("unexpected replay v3 schema structure")
          replay = replay.replace(
              replay_constant,
              '_DATASET_SCHEMA_VERSION_V4 = "candle-dataset-v4"',
              1,
          ).replace(
              replay_use,
              "_DATASET_SCHEMA_VERSION_V4\n                if closure_manifest",
              1,
          )
          replay_path.write_text(replay, encoding="utf-8")

          verification_path = Path("src/gemini_trading/data/verification/service.py")
          verification = verification_path.read_text(encoding="utf-8")
          constant_anchor = (
              '_DATASET_SCHEMA_VERSION_V3 = "candle-dataset-v3"\n'
              '_RETRIEVAL_SCHEMA_VERSION_V2 = "retrieval-manifest-v2"'
          )
          if verification.count(constant_anchor) != 1:
              raise SystemExit("unexpected verification schema constants")
          verification = verification.replace(
              constant_anchor,
              '_DATASET_SCHEMA_VERSION_V3 = "candle-dataset-v3"\n'
              '_DATASET_SCHEMA_VERSION_V4 = "candle-dataset-v4"\n'
              '_RETRIEVAL_SCHEMA_VERSION_V2 = "retrieval-manifest-v2"',
              1,
          )
          set_anchor = (
              "                    _DATASET_SCHEMA_VERSION_V3,\n"
              "                }"
          )
          if verification.count(set_anchor) != 4:
              raise SystemExit("unexpected verification sealed schema sets")
          verification = verification.replace(
              set_anchor,
              "                    _DATASET_SCHEMA_VERSION_V3,\n"
              "                    _DATASET_SCHEMA_VERSION_V4,\n"
              "                }",
          )
          equality_anchor = (
              'if mapping.get("schema_version") == _DATASET_SCHEMA_VERSION_V3'
          )
          if verification.count(equality_anchor) != 2:
              raise SystemExit("unexpected verification exclusion schema checks")
          verification = verification.replace(
              equality_anchor,
              'if mapping.get("schema_version") in {'
              '_DATASET_SCHEMA_VERSION_V3, _DATASET_SCHEMA_VERSION_V4}',
          )
          expected_anchor = (
              "_DATASET_SCHEMA_VERSION_V3\n"
              "                if closure_manifest"
          )
          if verification.count(expected_anchor) != 1:
              raise SystemExit("unexpected verification expected schema")
          verification = verification.replace(
              expected_anchor,
              "_DATASET_SCHEMA_VERSION_V4\n"
              "                if closure_manifest",
              1,
          )
          verification = verification.replace("_V3_CHECKS", "_SEALED_CHECKS")
          verification_path.write_text(verification, encoding="utf-8")
          PY
      - run: uv run ruff format src/gemini_trading/data/ingestion/replay.py src/gemini_trading/data/verification/service.py
      - run: uv run ruff check src/gemini_trading/data/ingestion/replay.py src/gemini_trading/data/verification/service.py tests/fixtures/market_data/multi_closure_ingestion.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run pyright src/gemini_trading/data/ingestion/replay.py src/gemini_trading/data/verification/service.py tests/fixtures/market_data/multi_closure_ingestion.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run pytest tests/integration/test_market_data_exchange_closure_v4.py -q
      - name: Commit verified Task 7 implementation
        run: |
          git rm .github/workflows/temporary-task7-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/data/ingestion/replay.py src/gemini_trading/data/verification/service.py
          git commit -m "feat: replay and verify multi-closure dataset v4"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
