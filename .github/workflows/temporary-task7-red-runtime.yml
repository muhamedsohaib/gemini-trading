name: Temporary Task 7 runtime RED

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  verify-red-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Require focused RED failure
        run: |
          set +e
          output="$(uv run pytest tests/integration/test_market_data_exchange_closure_v4.py -q 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "unsupported canonical dataset schema" <<<"$output"
          grep -q "test_provider_free_replay_reproduces_dataset_v4_exactly" <<<"$output"
      - name: Remove RED verifier
        run: |
          git rm .github/workflows/temporary-task7-red-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: confirm replay and verification v4 RED state"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
