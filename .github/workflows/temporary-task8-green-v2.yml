name: Temporary Task 8 GREEN v2

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  implement-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Add strict v4 dataset loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/gemini_trading/research/dataset_reader.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"missing reader anchor: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              "    dataset_id_v3,\n    serialize_candles,",
              "    dataset_id_v3,\n    dataset_id_v4,\n    serialize_candles,",
              "identity import",
          )
          replace_once(
              '''_MANIFEST_FIELDS_V3 = _MANIFEST_FIELDS_V2 | {
    "exclusion_manifest_sha256",
    "exclusion_count",
}
''',
              '''_MANIFEST_FIELDS_V3 = _MANIFEST_FIELDS_V2 | {
    "exclusion_manifest_sha256",
    "exclusion_count",
}
_MANIFEST_FIELDS_V4 = _MANIFEST_FIELDS_V3
''',
              "v4 fields",
          )
          replace_once(
              '''    expected_fields = (
        _MANIFEST_FIELDS_V3
        if schema_version == "candle-dataset-v3"
        else _MANIFEST_FIELDS_V2
        if schema_version == "candle-dataset-v2"
        else _MANIFEST_FIELDS_V1
    )''',
              '''    expected_fields = (
        _MANIFEST_FIELDS_V4
        if schema_version == "candle-dataset-v4"
        else _MANIFEST_FIELDS_V3
        if schema_version == "candle-dataset-v3"
        else _MANIFEST_FIELDS_V2
        if schema_version == "candle-dataset-v2"
        else _MANIFEST_FIELDS_V1
    )''',
              "field selection",
          )
          text = text.replace(
              '{"candle-dataset-v2", "candle-dataset-v3"}',
              '{"candle-dataset-v2", "candle-dataset-v3", "candle-dataset-v4"}',
          )
          text = text.replace(
              'if schema_version == "candle-dataset-v3"\n                else None',
              'if schema_version in {"candle-dataset-v3", "candle-dataset-v4"}\n'
              '                else None',
          )
          text = text.replace(
              'if schema_version == "candle-dataset-v3"\n                else 0',
              'if schema_version in {"candle-dataset-v3", "candle-dataset-v4"}\n'
              '                else 0',
          )
          replace_once(
              '''    if manifest.schema_version == "candle-dataset-v3":
        if (
            closure_manifest_bytes is None
            or exclusion_manifest_bytes is None
            or segment_manifest_bytes is None
        ):
            raise DatasetVerificationError("v3 supporting evidence is missing")
        expected_id = dataset_id_v3(''',
              '''    if manifest.schema_version == "candle-dataset-v4":
        if (
            closure_manifest_bytes is None
            or exclusion_manifest_bytes is None
            or segment_manifest_bytes is None
        ):
            raise DatasetVerificationError("v4 supporting evidence is missing")
        expected_id = dataset_id_v4(
            provider=manifest.provider,
            instrument=manifest.instrument,
            timeframe=manifest.timeframe,
            start_time=manifest.start_time,
            end_time=manifest.end_time,
            canonical_bytes=canonical_bytes,
            closure_manifest_bytes=closure_manifest_bytes,
            exclusion_manifest_bytes=exclusion_manifest_bytes,
            segment_manifest_bytes=segment_manifest_bytes,
        )
    elif manifest.schema_version == "candle-dataset-v3":
        if (
            closure_manifest_bytes is None
            or exclusion_manifest_bytes is None
            or segment_manifest_bytes is None
        ):
            raise DatasetVerificationError("v3 supporting evidence is missing")
        expected_id = dataset_id_v3(''',
              "v4 identity",
          )
          replace_once(
              '''    *,
    require_v2: bool = False,
    require_v3: bool = False,
) -> VerifiedDataset:''',
              '''    *,
    require_v2: bool = False,
    require_v3: bool = False,
    require_v4: bool = False,
) -> VerifiedDataset:''',
              "reader signature",
          )
          replace_once(
              '''        if require_v3 and manifest.schema_version != "candle-dataset-v3":
            raise DatasetVerificationError("sealed dataset loading requires candle-dataset-v3")''',
              '''        if require_v3 and manifest.schema_version != "candle-dataset-v3":
            raise DatasetVerificationError("sealed dataset loading requires candle-dataset-v3")
        if require_v4 and manifest.schema_version != "candle-dataset-v4":
            raise DatasetVerificationError("sealed dataset loading requires candle-dataset-v4")''',
              "strict v4 requirement",
          )
          replace_once(
              '            if manifest.schema_version == "candle-dataset-v3":\n',
              '            if manifest.schema_version in {"candle-dataset-v3", "candle-dataset-v4"}:\n',
              "exclusion load",
          )
          replace_once(
              '''            if exclusion_manifest is not None:
                if len(exclusion_manifest.exclusions) != manifest.exclusion_count:
                    raise DatasetVerificationError("exclusion count mismatch")
                declarations = {item.closure_id: item for item in closure_manifest.closures}''',
              '''            if exclusion_manifest is not None:
                if len(exclusion_manifest.exclusions) != manifest.exclusion_count:
                    raise DatasetVerificationError("exclusion count mismatch")
                if manifest.schema_version == "candle-dataset-v4":
                    closure_ids = tuple(item.closure_id for item in closure_manifest.closures)
                    exclusion_ids = tuple(item.closure_id for item in exclusion_manifest.exclusions)
                    if exclusion_ids != closure_ids:
                        raise DatasetVerificationError("exclusion declaration order mismatch")
                declarations = {item.closure_id: item for item in closure_manifest.closures}''',
              "ordered exclusion verification",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff format src/gemini_trading/research/dataset_reader.py tests/integration/test_research_dataset_reader_v4.py
      - run: uv run ruff check src/gemini_trading/research/dataset_reader.py tests/integration/test_research_dataset_reader.py tests/integration/test_research_dataset_reader_v4.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run pyright src/gemini_trading/research/dataset_reader.py tests/integration/test_research_dataset_reader.py tests/integration/test_research_dataset_reader_v4.py tests/integration/test_market_data_exchange_closure_v4.py
      - run: uv run pytest tests/integration/test_research_dataset_reader.py tests/integration/test_research_dataset_reader_v4.py tests/integration/test_market_data_exchange_closure_v4.py -q
      - name: Commit verified Task 8 implementation
        run: |
          git rm .github/workflows/temporary-task8-green-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/research/dataset_reader.py tests/integration/test_research_dataset_reader_v4.py
          git commit -m "feat: load and verify candle dataset v4 strictly"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
