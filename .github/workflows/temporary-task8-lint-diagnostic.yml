name: Temporary Task 8 lint diagnostic

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  diagnose-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Capture Ruff diagnostic
        run: |
          uv run ruff check tests/integration/test_research_dataset_reader_v4.py --output-format=concise > task8-ruff.txt || true
      - name: Commit diagnostic
        run: |
          git rm .github/workflows/temporary-task8-lint-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task8-ruff.txt
          git commit -m "chore: capture Task 8 Ruff diagnostic"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
