name: Temporary corrected Task 8 RED

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  verify-red-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Correct raw regex
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/integration/test_research_dataset_reader_v4.py")
          text = path.read_text(encoding="utf-8")
          old = 'match="order|identity"'
          new = 'match=r"order|identity"'
          if text.count(old) != 1:
              raise SystemExit("unexpected Task 8 regex structure")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - run: uv run ruff format --check tests/integration/test_research_dataset_reader_v4.py
      - run: uv run ruff check tests/integration/test_research_dataset_reader_v4.py
      - run: uv run pyright tests/integration/test_research_dataset_reader_v4.py
      - name: Require focused RED failure
        run: |
          set +e
          output="$(uv run pytest tests/integration/test_research_dataset_reader_v4.py -q 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "require_v4" <<<"$output"
      - name: Commit corrected RED state
        run: |
          git rm .github/workflows/temporary-task8-red-corrected.yml task8-ruff.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_research_dataset_reader_v4.py
          git commit -m "test: confirm strict verified dataset v4 RED state"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
