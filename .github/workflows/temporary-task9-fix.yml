name: Temporary Task 9 fix

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  fix-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Correct handoff test regexes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/unit/strategy/test_handoff.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'match="excluded provider row|closure ID"': 'match=r"excluded provider row|closure ID"',
              'match="order|duplicate"': 'match=r"order|duplicate"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected handoff regex structure: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff format --check src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
      - run: uv run ruff check src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
      - run: uv run pyright src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
      - run: uv run pytest tests/unit/strategy/test_handoff.py -q
      - name: Commit verified Task 9 fixes
        run: |
          git rm .github/workflows/temporary-task9-fix.yml task9-ruff.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/strategy/test_handoff.py
          git commit -m "test: complete sealed dataset handoff v4 contract"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
