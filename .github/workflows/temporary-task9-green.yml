name: Temporary Task 9 GREEN

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  implement-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Upgrade historical validation CLI to handoff v4
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/gemini_trading/cli/historical_validation.py")
          text = path.read_text(encoding="utf-8")

          old_import = '''from gemini_trading.strategy.handoff import (
    DatasetHandoffManifest,
    build_artifact_inventory,'''
          new_import = '''from gemini_trading.strategy.handoff import (
    DatasetHandoffManifest,
    ExcludedProviderRow,
    build_artifact_inventory,'''
          if text.count(old_import) != 1:
              raise SystemExit("unexpected handoff import structure")
          text = text.replace(old_import, new_import, 1)

          constants_start = '''_EXPECTED_EXCLUDED_ROW_SHA256 = (
    "6d0ed02c75960a3acf11073a2b7276e0bdc04f217fc99a488b15a5ff68e70775"  # pragma: allowlist secret
)
_EXPECTED_SEGMENT_BOUNDARIES = (228,)
_EXPECTED_CANDLE_COUNT = 18_617'''
          constants_new = '''_EXPECTED_COUNTS = (20, 20, 21)
_EXPECTED_CANDLE_COUNT = 18_582'''
          if text.count(constants_start) != 1:
              raise SystemExit("unexpected fixed handoff constants")
          text = text.replace(constants_start, constants_new, 1)

          text = text.replace(
              "load_verified_dataset(store, dataset_id, require_v3=True)",
              "load_verified_dataset(store, dataset_id, require_v4=True)",
              1,
          )
          text = text.replace(
              'raise CliUsageError("verified v3 dataset is missing supporting identity")',
              'raise CliUsageError("verified v4 dataset is missing supporting identity")',
              1,
          )

          old_identity = '''    excluded_row_hashes = tuple(
        item.provider_row_sha256 for item in dataset.exclusion_manifest.exclusions
    )
    segment_boundaries = dataset.segment_manifest.boundary_indices
    if (
        dataset.manifest.closure_count != 1
        or dataset.manifest.exclusion_count != 1
        or dataset.manifest.segment_count != 2
        or excluded_row_hashes != (_EXPECTED_EXCLUDED_ROW_SHA256,)
        or segment_boundaries != _EXPECTED_SEGMENT_BOUNDARIES
        or verification.candle_count != _EXPECTED_CANDLE_COUNT
    ):
        raise CliUsageError("verified v3 dataset fixed evidence identity mismatch")'''
          new_identity = '''    excluded_provider_rows = tuple(
        ExcludedProviderRow(
            closure_id=item.closure_id,
            provider_row_sha256=item.provider_row_sha256,
        )
        for item in dataset.exclusion_manifest.exclusions
    )
    segment_boundaries = dataset.segment_manifest.boundary_indices
    if (
        (
            dataset.manifest.closure_count,
            dataset.manifest.exclusion_count,
            dataset.manifest.segment_count,
        )
        != _EXPECTED_COUNTS
        or len(excluded_provider_rows) != _EXPECTED_COUNTS[1]
        or len(segment_boundaries) != _EXPECTED_COUNTS[0]
        or verification.candle_count != _EXPECTED_CANDLE_COUNT
    ):
        raise CliUsageError("verified v4 dataset fixed evidence identity mismatch")'''
          if text.count(old_identity) != 1:
              raise SystemExit("unexpected CLI fixed identity block")
          text = text.replace(old_identity, new_identity, 1)
          text = text.replace(
              'schema_version="sealed-dataset-handoff-v3"',
              'schema_version="sealed-dataset-handoff-v4"',
              1,
          )
          text = text.replace(
              "        excluded_provider_row_sha256=excluded_row_hashes[0],",
              "        excluded_provider_rows=excluded_provider_rows,",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff format src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
      - run: uv run ruff check src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
      - run: uv run pyright src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
      - run: uv run pytest tests/unit/strategy/test_handoff.py -q
      - name: Commit verified Task 9 implementation
        run: |
          git rm .github/workflows/temporary-task9-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gemini_trading/strategy/handoff.py src/gemini_trading/cli/historical_validation.py tests/sealed_dataset_support.py tests/unit/strategy/test_handoff.py
          git commit -m "feat: define sealed dataset handoff v4"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
