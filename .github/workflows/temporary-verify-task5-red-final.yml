name: Temporary verify final Task 5 RED state

on:
  push:
    branches:
      - research/verified-multi-closure-partial-candle-manifest

permissions:
  contents: write

jobs:
  verify-red-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/verified-multi-closure-partial-candle-manifest
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format tests/unit/data/datasets/test_canonical_writer_v4.py
      - run: uv run ruff check tests/unit/data/datasets/test_canonical_writer_v4.py
      - run: uv run pyright tests/unit/data/datasets/test_canonical_writer_v4.py
      - name: Require focused v4 failure
        run: |
          set +e
          output="$(uv run pytest tests/unit/data/datasets/test_canonical_writer_v4.py -q 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q "dataset_id_v4" <<<"$output"
      - name: Remove helper and commit formatted RED tests
        run: |
          git rm .github/workflows/temporary-verify-task5-red-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/data/datasets/test_canonical_writer_v4.py
          git commit -m "test: verify candle dataset v4 RED contract"
          git push origin HEAD:research/verified-multi-closure-partial-candle-manifest
