name: Candidate v0.3 Bundle RED

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run pytest tests/acceptance/test_candidate_v0_3_workflow.py -q
