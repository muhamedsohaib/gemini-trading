name: Candidate v0.3 Chronology Repair

on:
  pull_request:
    paths:
      - src/gemini_trading/strategy/study_predictions.py
      - src/gemini_trading/strategy/v0_3_study_plans.py
      - tests/unit/strategy/test_study_predictions.py
      - tests/unit/strategy/test_v0_3_study_plans.py
      - .github/workflows/v0-3-chronology-repair.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: >-
          uv run pytest
          tests/unit/strategy/test_study_predictions.py
          tests/unit/strategy/test_v0_3_study_plans.py
