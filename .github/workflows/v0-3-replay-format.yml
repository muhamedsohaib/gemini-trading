name: Candidate v0.3 Replay Format

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'chore: format v0.3 qualification replay' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format .
      - name: Commit formatter result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-replay-format.yml
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "style: format Candidate v0.3 qualification replay"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
