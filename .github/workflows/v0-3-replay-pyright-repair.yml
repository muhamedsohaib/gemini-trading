name: Candidate v0.3 Replay Pyright Repair

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: repair v0.3 replay typing retry' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - name: Apply exact replay typing repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gemini_trading/strategy/qualification_replay_v0_3.py')
          text = path.read_text()
          text = text.replace(
              '    max_active_raw = mapping.get("max_active_candles")\n'
              '    max_active = (\n'
              '        None\n'
              '        if max_active_raw is None\n'
              '        else _integer(mapping, "max_active_candles", "simulation config")\n'
              '    )\n',
              '    max_active = _integer(mapping, "max_active_candles", "simulation config")\n',
          )
          text = text.replace(
              '\n\ndef _case_directory(store: LocalResearchStore, record: StudyCaseEvidence) -> Path:\n'
              '    return store.directory(record.experiment_id)\n',
              '',
          )
          text = text.replace(
              '        mapping = _mapping(\n'
              '            (_case_directory(store, record) / "metrics.json").read_bytes(), "metrics"\n'
              '        )\n'
              '    except OSError:\n',
              '        mapping = _mapping(\n'
              '            store.read_artifact(record.experiment_id, "metrics.json"), "metrics"\n'
              '        )\n'
              '    except (OSError, ValueError):\n',
          )
          text = text.replace(
              '        rows = _rows((_case_directory(store, record) / "trades.jsonl").read_bytes(), "trades")\n'
              '    except OSError:\n',
              '        rows = _rows(store.read_artifact(record.experiment_id, "trades.jsonl"), "trades")\n'
              '    except (OSError, ValueError):\n',
          )
          text = text.replace(
              '        rows = _rows(\n'
              '            (_case_directory(store, record) / "account-series.jsonl").read_bytes(),\n'
              '            "account series",\n'
              '        )\n'
              '    except OSError:\n',
              '        rows = _rows(\n'
              '            store.read_artifact(record.experiment_id, "account-series.jsonl"),\n'
              '            "account series",\n'
              '        )\n'
              '    except (OSError, ValueError):\n',
          )
          text = text.replace(
              '        simulation_raw = (\n'
              '            _case_directory(store, primary_record) / "simulation-config.json"\n'
              '        ).read_bytes()\n'
              '    except OSError:\n',
              '        simulation_raw = store.read_artifact(\n'
              '            primary_record.experiment_id, "simulation-config.json"\n'
              '        )\n'
              '    except (OSError, ValueError):\n',
          )
          text = text.replace(
              '    if not isinstance(development_test_indices, tuple) or not development_test_indices:\n'
              '        raise StudyArtifactError("v0.3 replay fold development-test indices are invalid")\n'
              '    start = development_test.start_inclusive\n'
              '    if isinstance(start, bool) or not isinstance(start, int):\n'
              '        raise StudyArtifactError("v0.3 replay fold start is invalid")\n'
              '    last_index = development_test_indices[-1]\n'
              '    if isinstance(last_index, bool) or not isinstance(last_index, int):\n'
              '        raise StudyArtifactError("v0.3 replay fold end is invalid")\n',
              '    if not development_test_indices:\n'
              '        raise StudyArtifactError("v0.3 replay fold development-test indices are invalid")\n'
              '    start = development_test.start_inclusive\n'
              '    last_index = development_test_indices[-1]\n',
          )
          path.write_text(text)
          PY
          uv run ruff format src/gemini_trading/strategy/qualification_replay_v0_3.py
          uv run ruff check src/gemini_trading/strategy/qualification_replay_v0_3.py
          uv run pyright src/gemini_trading/strategy/qualification_replay_v0_3.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-replay-pyright-repair.yml
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: harden Candidate v0.3 qualification replay typing"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
