name: Candidate v0.3 Result Canonical Repair

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - name: Enforce canonical qualification result bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gemini_trading/strategy/qualification_artifacts_v0_3.py')
          text = path.read_text()
          needle = '''    if hashlib.sha256(canonical_json_bytes(structural)).hexdigest() != qualification_id:
        raise StudyArtifactError("v0.3 qualification structural identity changed")
    files = tuple(sorted((*core, (_RESULT, result_raw))))
'''
          replacement = '''    if hashlib.sha256(canonical_json_bytes(structural)).hexdigest() != qualification_id:
        raise StudyArtifactError("v0.3 qualification structural identity changed")
    expected_result = canonical_json_bytes(
        {
            "schema_version": _SCHEMA,
            "qualification_id": qualification_id,
            "classification": classification.value,
            "inventory_root_sha256": root_sha,
            "artifacts": _inventory_payload(core),
        }
    )
    if result_raw != expected_result:
        raise StudyArtifactError("v0.3 qualification result canonical bytes changed")
    files = tuple(sorted((*core, (_RESULT, result_raw))))
'''
          if needle not in text:
              raise SystemExit('canonical result patch anchor missing')
          path.write_text(text.replace(needle, replacement))
          PY
      - run: uv run ruff format src/gemini_trading/strategy/qualification_artifacts_v0_3.py tests/unit/strategy/test_qualification_artifacts_v0_3.py
      - run: uv run ruff check src/gemini_trading/strategy/qualification_artifacts_v0_3.py tests/unit/strategy/test_qualification_artifacts_v0_3.py
      - run: uv run pyright src/gemini_trading/strategy/qualification_artifacts_v0_3.py tests/unit/strategy/test_qualification_artifacts_v0_3.py
      - run: uv run pytest tests/unit/strategy/test_qualification_artifacts_v0_3.py -q
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-result-canonical-repair.yml
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: enforce canonical v0.3 qualification result"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
