name: Candidate v0.3 Stage 1 GREEN Repair

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Correct v0.3-only handoff annotation cardinality
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/repair_v03_stage1.py')
          text = path.read_text()
          old = '''replace_once(
              execution,
              ''' + "'''    handoff: DatasetHandoffManifest,\\n'''" + ''',
              ''' + "'''    handoff: V03DatasetHandoffManifest,\\n'''" + ''',
          )
          '''
          new = '''target = Path(execution)
          text = target.read_text()
          old_annotation = "    handoff: DatasetHandoffManifest,\\n"
          if text.count(old_annotation) != 2:
              raise SystemExit("expected exactly two v0.3 handoff annotations")
          target.write_text(text.replace(old_annotation, "    handoff: V03DatasetHandoffManifest,\\n"))
          '''
          if old not in text:
              raise SystemExit('v0.3 annotation repair block missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python .github/scripts/repair_v03_stage1.py
      - name: Format changed Python files
        run: |
          uv run ruff format \
            src/gemini_trading/cli/main.py \
            src/gemini_trading/cli/candidate_v0_3.py \
            src/gemini_trading/strategy/v0_3_stage1.py \
            src/gemini_trading/strategy/qualification_execution_v0_3.py \
            src/gemini_trading/strategy/qualification_verification_v0_3.py \
            tests/unit/strategy/test_v0_3_stage1.py
      - name: Focused Ruff
        run: |
          uv run ruff check \
            src/gemini_trading/cli/main.py \
            src/gemini_trading/cli/candidate_v0_3.py \
            src/gemini_trading/strategy/v0_3_stage1.py \
            src/gemini_trading/strategy/qualification_execution_v0_3.py \
            src/gemini_trading/strategy/qualification_verification_v0_3.py \
            tests/unit/strategy/test_v0_3_stage1.py
      - name: Focused Pyright
        run: |
          uv run pyright \
            src/gemini_trading/cli/main.py \
            src/gemini_trading/cli/candidate_v0_3.py \
            src/gemini_trading/strategy/v0_3_stage1.py \
            src/gemini_trading/strategy/qualification_execution_v0_3.py \
            src/gemini_trading/strategy/qualification_verification_v0_3.py \
            tests/unit/strategy/test_v0_3_stage1.py
      - name: Stage 1 and regression tests
        run: |
          uv run pytest \
            tests/unit/strategy/test_v0_3_stage1.py \
            tests/unit/strategy/test_qualification_execution_v0_3.py \
            tests/unit/strategy/test_qualification_verification_v0_3.py \
            tests/integration/test_candidate_v0_3_cli.py \
            tests/acceptance/test_candidate_v0_3_workflow.py \
            tests/unit/cli/test_historical_validation.py \
            -q
      - name: Commit verified repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/v0-3-stage1-red.yml \
            .github/workflows/v0-3-stage1-green-repair.yml \
            .github/scripts/repair_v03_stage1.py
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: isolate Candidate v0.3 Stage 1 dataset"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
