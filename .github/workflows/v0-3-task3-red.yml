name: Candidate v0.3 Task 3 Apply

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: dispatch v0.3 task3 implementation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen

      - name: Apply minimal arbitration overlay
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gemini_trading/strategy/arbitration.py')
          text = path.read_text(encoding='utf-8')

          marker = '''@dataclass(frozen=True, slots=True)\nclass MultiModelArbiter:\n'''
          overlay = '''@dataclass(frozen=True, slots=True)\nclass ArbitrationOverlay:\n    """Optional v0.3 entry-only arbitration controls."""\n\n    entry_probability_threshold: Decimal | None = None\n    enforce_companion_probability: bool = True\n    enforce_disagreement: bool = True\n\n    def __post_init__(self) -> None:\n        if self.entry_probability_threshold is not None:\n            _probability(\n                self.entry_probability_threshold,\n                "entry_probability_threshold",\n            )\n        if not isinstance(self.enforce_companion_probability, bool):\n            raise ValueError("enforce_companion_probability must be bool")\n        if not isinstance(self.enforce_disagreement, bool):\n            raise ValueError("enforce_disagreement must be bool")\n\n\n@dataclass(frozen=True, slots=True)\nclass MultiModelArbiter:\n'''
          if marker not in text:
              raise SystemExit('arbiter class marker missing')
          text = text.replace(marker, overlay, 1)

          old_decide = '''    def decide(self, source: ArbitrationInput) -> ArbitrationDecision:\n        """Return one deterministic transition from the supplied state."""\n\n        entry_hurdle = (\n            source.base_hurdle_bps + self.policy.expected_edge_extra_bps\n        ) / _BASIS_POINTS\n        if source.currently_long:\n            return self._decide_long(source, entry_hurdle)\n        return self._decide_cash(source, entry_hurdle)\n'''
          new_decide = '''    def decide(\n        self,\n        source: ArbitrationInput,\n        overlay: ArbitrationOverlay | None = None,\n    ) -> ArbitrationDecision:\n        """Return one deterministic transition from the supplied state."""\n\n        entry_hurdle = (\n            source.base_hurdle_bps + self.policy.expected_edge_extra_bps\n        ) / _BASIS_POINTS\n        if source.currently_long:\n            return self._decide_long(source, entry_hurdle)\n        return self._decide_cash(source, entry_hurdle, overlay)\n'''
          if old_decide not in text:
              raise SystemExit('decide marker missing')
          text = text.replace(old_decide, new_decide, 1)

          old_cash_sig = '''    def _decide_cash(\n        self,\n        source: ArbitrationInput,\n        entry_hurdle: Decimal,\n    ) -> ArbitrationDecision:\n'''
          new_cash_sig = '''    def _decide_cash(\n        self,\n        source: ArbitrationInput,\n        entry_hurdle: Decimal,\n        overlay: ArbitrationOverlay | None,\n    ) -> ArbitrationDecision:\n'''
          if old_cash_sig not in text:
              raise SystemExit('cash signature marker missing')
          text = text.replace(old_cash_sig, new_cash_sig, 1)

          old_rules = '''        reasons: list[str] = []\n        if active_probability < self.policy.entry_probability:\n            reasons.append("active_probability_below_entry")\n        if companion_probability < self.policy.companion_probability_floor:\n            reasons.append("companion_probability_below_floor")\n        if (\n            abs(source.trend_probability - source.mean_reversion_probability)\n            > self.policy.disagreement_limit\n        ):\n            reasons.append("specialist_disagreement")\n'''
          new_rules = '''        entry_probability = (\n            self.policy.entry_probability\n            if overlay is None or overlay.entry_probability_threshold is None\n            else overlay.entry_probability_threshold\n        )\n        enforce_companion = overlay is None or overlay.enforce_companion_probability\n        enforce_disagreement = overlay is None or overlay.enforce_disagreement\n        reasons: list[str] = []\n        if active_probability < entry_probability:\n            reasons.append("active_probability_below_entry")\n        if (\n            enforce_companion\n            and companion_probability < self.policy.companion_probability_floor\n        ):\n            reasons.append("companion_probability_below_floor")\n        if (\n            enforce_disagreement\n            and abs(source.trend_probability - source.mean_reversion_probability)\n            > self.policy.disagreement_limit\n        ):\n            reasons.append("specialist_disagreement")\n'''
          if old_rules not in text:
              raise SystemExit('cash rules marker missing')
          path.write_text(text.replace(old_rules, new_rules, 1), encoding='utf-8')
          PY

      - name: Verify focused GREEN and old behavior
        run: |
          uv run pytest -q tests/unit/strategy/test_arbitration_v0_3.py tests/unit/strategy/test_arbitration.py
          uv run ruff check src/gemini_trading/strategy/arbitration.py tests/unit/strategy/test_arbitration_v0_3.py tests/unit/strategy/test_arbitration.py
          uv run pyright src/gemini_trading/strategy/arbitration.py tests/unit/strategy/test_arbitration_v0_3.py tests/unit/strategy/test_arbitration.py

      - name: Commit verified Task 3 and remove dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-task3-red.yml
          git add src/gemini_trading/strategy/arbitration.py
          git commit -m "feat: add v0.3 arbitration overlay"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
