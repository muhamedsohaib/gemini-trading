name: Candidate v0.3 Task 4 Apply

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: dispatch v0.3 task4 implementation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen

      - name: Extend candidate schedules with optional v0.3 thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/gemini_trading/strategy/study_predictions.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from gemini_trading.strategy.arbitration import ArbitrationInput, MultiModelArbiter\n'
          new_import = '''from gemini_trading.strategy.arbitration import (\n    ArbitrationInput,\n    ArbitrationOverlay,\n    MultiModelArbiter,\n)\n'''
          if old_import not in text:
              raise SystemExit('arbitration import marker missing')
          text = text.replace(old_import, new_import, 1)

          old_signature = '''    delayed: bool = False,\n    invert_probabilities: bool = False,\n    volume_ablation: bool = False,\n) -> tuple[tuple[int, ScheduledAction], ...]:\n    """Convert calibrated predictions into a deterministic long-or-cash schedule."""\n\n    arbiter = MultiModelArbiter(policy)\n'''
          new_signature = '''    delayed: bool = False,\n    invert_probabilities: bool = False,\n    volume_ablation: bool = False,\n    entry_thresholds: Mapping[SpecialistKind, Decimal] | None = None,\n    companion_disagreement_diagnostic_only: bool = False,\n) -> tuple[tuple[int, ScheduledAction], ...]:\n    """Convert calibrated predictions into a deterministic long-or-cash schedule."""\n\n    if entry_thresholds is not None:\n        required_specialists = {SpecialistKind.TREND, SpecialistKind.MEAN_REVERSION}\n        if set(entry_thresholds) != required_specialists:\n            raise ValueError("entry_thresholds must contain exactly both specialists")\n        if any(\n            not threshold.is_finite()\n            or threshold < Decimal("0")\n            or threshold > Decimal("1")\n            for threshold in entry_thresholds.values()\n        ):\n            raise ValueError("entry thresholds must be finite probabilities")\n    arbiter = MultiModelArbiter(policy)\n'''
          if old_signature not in text:
              raise SystemExit('candidate signature marker missing')
          text = text.replace(old_signature, new_signature, 1)

          old_decision = '''        decision = arbiter.decide(\n            ArbitrationInput(\n                candle_index=index,\n                regime=source_item.regime.state,\n                trend_probability=trend_probability,\n                trend_expected_gross_return=trend_expected,\n                mean_reversion_probability=mean_probability,\n                mean_reversion_expected_gross_return=mean_expected,\n                currently_long=currently_long,\n                active_specialist=active_specialist,\n                hold_age=hold_age,\n                cooldown_remaining=cooldown,\n                indeterminate_streak=indeterminate_streak,\n                entry_price=entry_price,\n                highest_close_since_entry=highest_close,\n                current_close=candle.close,\n                current_low=candle.low,\n                atr24=matrix.value_for(index, "atr_24"),\n                current_stop=current_stop,\n                stretch_active=stretch_active,\n                base_hurdle_bps=label_policy.hurdle_bps,\n            )\n        )\n'''
          new_decision = '''        source = ArbitrationInput(\n            candle_index=index,\n            regime=source_item.regime.state,\n            trend_probability=trend_probability,\n            trend_expected_gross_return=trend_expected,\n            mean_reversion_probability=mean_probability,\n            mean_reversion_expected_gross_return=mean_expected,\n            currently_long=currently_long,\n            active_specialist=active_specialist,\n            hold_age=hold_age,\n            cooldown_remaining=cooldown,\n            indeterminate_streak=indeterminate_streak,\n            entry_price=entry_price,\n            highest_close_since_entry=highest_close,\n            current_close=candle.close,\n            current_low=candle.low,\n            atr24=matrix.value_for(index, "atr_24"),\n            current_stop=current_stop,\n            stretch_active=stretch_active,\n            base_hurdle_bps=label_policy.hurdle_bps,\n        )\n        if entry_thresholds is None:\n            decision = arbiter.decide(source)\n        else:\n            if source_item.regime.state is RegimeState.TRENDING:\n                active_entry_threshold = entry_thresholds[SpecialistKind.TREND]\n            elif source_item.regime.state is RegimeState.RANGING:\n                active_entry_threshold = entry_thresholds[SpecialistKind.MEAN_REVERSION]\n            else:\n                active_entry_threshold = None\n            overlay = ArbitrationOverlay(\n                entry_probability_threshold=active_entry_threshold,\n                enforce_companion_probability=not companion_disagreement_diagnostic_only,\n                enforce_disagreement=not companion_disagreement_diagnostic_only,\n            )\n            decision = arbiter.decide(source, overlay)\n'''
          if old_decision not in text:
              raise SystemExit('candidate decision marker missing')
          path.write_text(text.replace(old_decision, new_decision, 1), encoding='utf-8')
          PY

      - name: Verify focused GREEN and legacy regressions
        run: |
          uv run pytest -q tests/unit/strategy/test_v0_3_predictions.py tests/unit/strategy/test_study_predictions.py tests/unit/strategy/test_arbitration_v0_3.py tests/unit/strategy/test_arbitration.py
          uv run ruff check src/gemini_trading/strategy/v0_3_predictions.py src/gemini_trading/strategy/study_predictions.py tests/unit/strategy/test_v0_3_predictions.py tests/unit/strategy/test_study_predictions.py
          uv run pyright src/gemini_trading/strategy/v0_3_predictions.py src/gemini_trading/strategy/study_predictions.py tests/unit/strategy/test_v0_3_predictions.py tests/unit/strategy/test_study_predictions.py

      - name: Commit verified Task 4 and remove dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-task4-red.yml
          git add src/gemini_trading/strategy/study_predictions.py
          git commit -m "feat: build v0.3 calibrated prediction schedules"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
