name: Candidate v0.3 Task 5 GREEN

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: read

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'test: verify GREEN v0.3 development split plan after type fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - name: Verify focused GREEN and old split regression
        run: |
          uv run pytest -q tests/unit/strategy/test_v0_3_development_splits.py tests/unit/strategy/test_v0_2_development_splits.py tests/unit/strategy/test_strategy_splits.py
          uv run ruff check src/gemini_trading/strategy/v0_3_splits.py tests/unit/strategy/test_v0_3_development_splits.py
          uv run pyright src/gemini_trading/strategy/v0_3_splits.py tests/unit/strategy/test_v0_3_development_splits.py
