name: Candidate v0.3 Task 6 GREEN

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: read

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'test: verify GREEN v0.3 qualification cases after formatting' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - name: Verify Task 6 GREEN and legacy replay isolation
        run: |
          uv run pytest -q tests/unit/strategy/test_v0_3_study_plans.py tests/unit/strategy/test_strategy_verification.py tests/unit/strategy/test_study_predictions.py
          uv run ruff check src/gemini_trading/strategy/v0_3_cases.py src/gemini_trading/strategy/v0_3_study_plans.py src/gemini_trading/strategy/study_strategy.py tests/unit/strategy/test_v0_3_study_plans.py
          uv run pyright src/gemini_trading/strategy/v0_3_cases.py src/gemini_trading/strategy/v0_3_study_plans.py src/gemini_trading/strategy/study_strategy.py
