name: Candidate v0.3 Task 6 RED

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: read

jobs:
  red:
    if: "${{ github.event.head_commit.message == 'test: add RED v0.3 qualification cases' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - name: Verify expected RED
        run: |
          set +e
          uv run pytest -q tests/unit/strategy/test_v0_3_study_plans.py > /tmp/red.txt 2>&1
          status=$?
          set -e
          cat /tmp/red.txt
          test "$status" -ne 0
          grep -F "No module named 'gemini_trading.strategy.v0_3_cases'" /tmp/red.txt
