name: Candidate v0.3 Task 6 GREEN

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore: dispatch v0.3 task6 GREEN verification' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen

      - name: Register v0.3 for provider-free replay
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/gemini_trading/strategy/replay.py')
          text = path.read_text(encoding='utf-8')
          old = '''    "candidate.multi_model.v0_1",\n    "candidate.multi_model.v0_2",\n    "cash.v1",\n'''
          new = '''    "candidate.multi_model.v0_1",\n    "candidate.multi_model.v0_2",\n    "candidate.multi_model.v0_3",\n    "cash.v1",\n'''
          if old not in text:
              raise SystemExit('replay strategy registry marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify Task 6 GREEN and replay isolation
        run: |
          uv run pytest -q tests/unit/strategy/test_v0_3_study_plans.py tests/unit/strategy/test_strategy_verification.py
          uv run ruff check src/gemini_trading/strategy/v0_3_cases.py src/gemini_trading/strategy/v0_3_study_plans.py src/gemini_trading/strategy/replay.py tests/unit/strategy/test_v0_3_study_plans.py
          uv run pyright src/gemini_trading/strategy/v0_3_cases.py src/gemini_trading/strategy/v0_3_study_plans.py

      - name: Commit verified Task 6 and remove dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-task6-red.yml
          git add src/gemini_trading/strategy/replay.py
          git commit -m "feat: define v0.3 qualification cases"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
