name: Candidate v0.3 Task 8 Lint Repair

on:
  push:
    branches:
      - research/candidate-v0-3-calibrated-arbitration

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: repair v0.3 task8 lint' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: research/candidate-v0-3-calibrated-arbitration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.25
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: uv sync --all-groups --frozen
      - name: Apply exact lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          execution = Path('src/gemini_trading/strategy/qualification_execution_v0_3.py')
          text = execution.read_text()
          text = text.replace('from gemini_trading.strategy.contracts import SpecialistKind\n', '')
          text = text.replace(
              'from gemini_trading.strategy.qualification_v0_3 import (\n',
              'from gemini_trading.strategy.qualification_v0_3 import (\n',
          )
          text = text.replace(
              'from gemini_trading.strategy.study import StudyCaseEvidence, StudyPhase\n',
              'from gemini_trading.strategy.splits import WalkForwardFold\n'
              'from gemini_trading.strategy.study import StudyCaseEvidence, StudyPhase\n',
          )
          text = text.replace('    fold: object,\n', '    fold: WalkForwardFold,\n')
          text = text.replace(
              '    fold_number = getattr(fold, "fold_number")\n'
              '    development_test = getattr(fold, "development_test")\n',
              '    fold_number = fold.fold_number\n'
              '    development_test = fold.development_test\n',
          )
          execution.write_text(text)

          verification = Path('src/gemini_trading/strategy/qualification_verification_v0_3.py')
          text = verification.read_text()
          anchor = 'from gemini_trading.strategy.entry_selectivity import (\n'
          text = text.replace(
              anchor,
              'from gemini_trading.strategy.contracts import SpecialistKind\n' + anchor,
          )
          verification.write_text(text)
          PY
          uv run ruff check --fix src/gemini_trading/strategy/qualification_execution_v0_3.py src/gemini_trading/strategy/qualification_verification_v0_3.py
          uv run ruff format src/gemini_trading/strategy/qualification_execution_v0_3.py src/gemini_trading/strategy/qualification_verification_v0_3.py
          uv run ruff check src/gemini_trading/strategy/qualification_execution_v0_3.py src/gemini_trading/strategy/qualification_verification_v0_3.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v0-3-task8-lint-repair.yml
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: satisfy v0.3 qualification lint contract"
          git push origin HEAD:research/candidate-v0-3-calibrated-arbitration
