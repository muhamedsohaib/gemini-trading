name: Verify Merged Main a267571

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  merged-main-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: a267571df5cc9eaa9980a0dfdfdb4d639c896e17
          fetch-depth: 0
      - name: Assert exact merged-main commit
        run: |
          test "$(git rev-parse HEAD)" = "a267571df5cc9eaa9980a0dfdfdb4d639c896e17"
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files
      - name: Reassert exact clean merged-main commit
        run: |
          test "$(git rev-parse HEAD)" = "a267571df5cc9eaa9980a0dfdfdb4d639c896e17"
          test -z "$(git status --porcelain)"

  merged-main-gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: a267571df5cc9eaa9980a0dfdfdb4d639c896e17
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
