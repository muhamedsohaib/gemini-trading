name: Verify PR42 Acceptance Path

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 8445cd4de8ad15b1cab1dffd70cd2999a2e436b2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: test "$(git rev-parse HEAD)" = "8445cd4de8ad15b1cab1dffd70cd2999a2e436b2"
      - run: >-
          uv run pytest
          tests/acceptance/test_sealed_historical_validation_end_to_end.py::test_complete_sealed_path_is_provider_free_and_non_promotional
          -q
