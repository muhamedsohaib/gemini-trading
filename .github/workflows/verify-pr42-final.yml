name: Verify PR42 Acceptance Fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 869dab35eba7fe31f1f3dbe246a0c3b090139b71
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Extract reusable bounded-training fixture
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          integration_path = Path("tests/integration/test_sealed_historical_validation.py")
          integration = integration_path.read_text(encoding="utf-8")
          old = '''@pytest.fixture(autouse=True)
def bound_integration_training(monkeypatch: pytest.MonkeyPatch) -> None:
    preparation_cache: dict[bool, CandidatePreparation] = {}

    def cached_candidate_preparation(
        *,
        dataset: VerifiedDataset,
        simulation: SimulationConfig,
        initial_cash: Decimal,
        include_final: bool,
    ) -> CandidatePreparation:
        cached = preparation_cache.get(include_final)
        if cached is None:
            cached = build_candidate_preparation_unbounded(
                dataset=dataset,
                simulation=simulation,
                initial_cash=initial_cash,
                include_final=include_final,
            )
            preparation_cache[include_final] = cached
        return cached

    monkeypatch.setattr(
        sealed_evaluator,
        "fit_prediction_bundle",
        _bounded_prediction_bundle,
    )
    monkeypatch.setattr(
        sealed_evaluator,
        "build_split_plan",
        _bounded_split_plan,
    )
    monkeypatch.setattr(
        sealed_evaluator,
        "build_candidate_preparation",
        cached_candidate_preparation,
    )


'''
          new = '''def apply_bounded_integration_training(monkeypatch: pytest.MonkeyPatch) -> None:
    """Install the deterministic bounded trainer used by sealed integration tests."""

    preparation_cache: dict[bool, CandidatePreparation] = {}

    def cached_candidate_preparation(
        *,
        dataset: VerifiedDataset,
        simulation: SimulationConfig,
        initial_cash: Decimal,
        include_final: bool,
    ) -> CandidatePreparation:
        cached = preparation_cache.get(include_final)
        if cached is None:
            cached = build_candidate_preparation_unbounded(
                dataset=dataset,
                simulation=simulation,
                initial_cash=initial_cash,
                include_final=include_final,
            )
            preparation_cache[include_final] = cached
        return cached

    monkeypatch.setattr(
        sealed_evaluator,
        "fit_prediction_bundle",
        _bounded_prediction_bundle,
    )
    monkeypatch.setattr(
        sealed_evaluator,
        "build_split_plan",
        _bounded_split_plan,
    )
    monkeypatch.setattr(
        sealed_evaluator,
        "build_candidate_preparation",
        cached_candidate_preparation,
    )


@pytest.fixture(autouse=True)
def bound_integration_training(monkeypatch: pytest.MonkeyPatch) -> None:
    apply_bounded_integration_training(monkeypatch)


'''
          if integration.count(old) != 1:
              raise SystemExit("unexpected sealed integration fixture block")
          integration_path.write_text(integration.replace(old, new, 1), encoding="utf-8")

          acceptance_path = Path("tests/acceptance/test_sealed_historical_validation_end_to_end.py")
          acceptance = acceptance_path.read_text(encoding="utf-8")
          import_old = '''from integration.test_sealed_historical_validation import (
    test_complete_requires_matching_durable_receipt as _run_complete_sealed_path,
)
'''
          import_new = '''from integration.test_sealed_historical_validation import (
    apply_bounded_integration_training,
)
from integration.test_sealed_historical_validation import (
    test_complete_requires_matching_durable_receipt as _run_complete_sealed_path,
)
'''
          if acceptance.count(import_old) != 1:
              raise SystemExit("unexpected acceptance sealed-path import")
          acceptance = acceptance.replace(import_old, import_new, 1)
          call_old = '''    monkeypatch.setattr(BinanceSpotProvider, "__init__", deny_provider)

    _run_complete_sealed_path(tmp_path)
'''
          call_new = '''    monkeypatch.setattr(BinanceSpotProvider, "__init__", deny_provider)
    apply_bounded_integration_training(monkeypatch)

    _run_complete_sealed_path(tmp_path)
'''
          if acceptance.count(call_old) != 1:
              raise SystemExit("unexpected acceptance sealed-path call")
          acceptance_path.write_text(acceptance.replace(call_old, call_new, 1), encoding="utf-8")
          PY
      - run: >-
          uv run ruff format
          tests/integration/test_sealed_historical_validation.py
          tests/acceptance/test_sealed_historical_validation_end_to_end.py
      - run: >-
          uv run ruff check
          tests/integration/test_sealed_historical_validation.py
          tests/acceptance/test_sealed_historical_validation_end_to_end.py
      - run: >-
          uv run pyright
          tests/integration/test_sealed_historical_validation.py
          tests/acceptance/test_sealed_historical_validation_end_to_end.py
      - run: >-
          uv run pytest
          tests/integration/test_sealed_historical_validation.py::test_complete_requires_matching_durable_receipt
          tests/acceptance/test_sealed_historical_validation_end_to_end.py::test_complete_sealed_path_is_provider_free_and_non_promotional
          -q
      - name: Package verified files
        run: |
          mkdir -p acceptance-fixture/tests/integration
          mkdir -p acceptance-fixture/tests/acceptance
          cp tests/integration/test_sealed_historical_validation.py acceptance-fixture/tests/integration/
          cp tests/acceptance/test_sealed_historical_validation_end_to_end.py acceptance-fixture/tests/acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-acceptance-fixture-${{ github.sha }}-${{ github.run_id }}
          path: acceptance-fixture/
          if-no-files-found: error
          retention-days: 7
