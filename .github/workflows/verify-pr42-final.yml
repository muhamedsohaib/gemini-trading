name: Verify PR42 SHA Allowlists

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patch-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: f0ea8d23429a87b541446d5acf105c60ad6af572
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - name: Add exact file-scoped SHA allowlists
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path

          paths = (
              Path("tests/unit/data/test_exchange_closures.py"),
              Path("src/gemini_trading/strategy/sealed_dataset_identity.py"),
          )
          digest_pattern = re.compile(r'^(\s*)"[0-9a-f]{64}",\s*$')
          ineffective = re.compile(r'^(\s*)\),\s+# pragma: allowlist secret$')
          added = 0
          removed = 0
          for path in paths:
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "# ruff: noqa: E501":
                  lines.insert(0, "# ruff: noqa: E501")
              output: list[str] = []
              for raw_line in lines:
                  ineffective_match = ineffective.fullmatch(raw_line)
                  if ineffective_match:
                      raw_line = f"{ineffective_match.group(1)}),"
                      removed += 1
                  if digest_pattern.fullmatch(raw_line):
                      raw_line = f"{raw_line}  # pragma: allowlist secret"
                      added += 1
                  output.append(raw_line)
              path.write_text("\n".join(output) + "\n", encoding="utf-8")
          if (added, removed) != (40, 40):
              raise SystemExit(
                  f"expected 40 added and 40 removed allowlists, got {added} and {removed}"
              )
          PY
      - run: >-
          uv run ruff format
          tests/unit/data/test_exchange_closures.py
          src/gemini_trading/strategy/sealed_dataset_identity.py
      - run: >-
          uv run ruff check
          tests/unit/data/test_exchange_closures.py
          src/gemini_trading/strategy/sealed_dataset_identity.py
      - run: >-
          uv run pyright
          tests/unit/data/test_exchange_closures.py
          src/gemini_trading/strategy/sealed_dataset_identity.py
      - run: >-
          uv run pytest
          tests/unit/data/test_exchange_closures.py
          tests/unit/strategy/test_sealed_dataset_identity.py
          -q
      - run: uv run pre-commit run detect-secrets --all-files
      - name: Package verified files
        run: |
          mkdir -p sha-allowlists/tests/unit/data
          mkdir -p sha-allowlists/src/gemini_trading/strategy
          cp tests/unit/data/test_exchange_closures.py sha-allowlists/tests/unit/data/
          cp src/gemini_trading/strategy/sealed_dataset_identity.py sha-allowlists/src/gemini_trading/strategy/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-sha-allowlists-${{ github.sha }}-${{ github.run_id }}
          path: sha-allowlists/
          if-no-files-found: error
          retention-days: 7
