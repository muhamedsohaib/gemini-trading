name: Verify PR42 Merged Main

on:
  pull_request:
    paths:
      - .github/workflows/verify-pr42-merged-main.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 7da1a48c9981364fd6544bae3e4d99673326363f
          fetch-depth: 0
      - name: Assert exact merged main
        run: |
          test "$(git rev-parse HEAD)" = "7da1a48c9981364fd6544bae3e4d99673326363f"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7da1a48c9981364fd6544bae3e4d99673326363f"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -m build
      - run: uv run pip-audit
      - name: Validate tracked-file policy
        run: >-
          uv run python -c "import subprocess;
          from gemini_trading.safety.repository_policy import validate_tracked_paths;
          validate_tracked_paths(subprocess.check_output(['git','ls-files'], text=True).splitlines())"
      - name: Scan tracked files for secrets
        run: uv run pre-commit run detect-secrets --all-files

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 7da1a48c9981364fd6544bae3e4d99673326363f
          fetch-depth: 0
      - name: Assert exact merged main
        run: |
          test "$(git rev-parse HEAD)" = "7da1a48c9981364fd6544bae3e4d99673326363f"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "7da1a48c9981364fd6544bae3e4d99673326363f"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
