name: Verify Stage 1 Replay Fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 52b6908eb3e6d469e0c82c311f1584bc26569e9e # pragma: allowlist secret
          fetch-depth: 0
      - name: Assert exact corrected head
        run: test "$(git rev-parse HEAD)" = "52b6908eb3e6d469e0c82c311f1584bc26569e9e" # pragma: allowlist secret
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.25"
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - run: >-
          uv run pytest
          tests/regression/test_dataset_replay_idempotency.py
          tests/acceptance/test_sealed_workflow_fail_closed.py
          -q
